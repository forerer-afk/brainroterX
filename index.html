<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brainroter X</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    overflow-x: hidden;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: .45;
    cursor: default;
}

/* TOP */

.topbar {
    position: sticky;
    top: 0;
    z-index: 100;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 10px 12px;

    background: #0f172a;
    border-bottom: 1px solid #334155;
}

.logo {
    font-size: 18px;
    font-weight: bold;
}

.top-right {
    display: flex;
    align-items: center;
    gap: 7px;
}

.balance-box {
    background: #1e293b;
    border-radius: 12px;
    padding: 9px 11px;
    font-weight: bold;
}

.deposit-top-btn {
    background: #22c55e;
    color: white;
    border-radius: 12px;
    padding: 10px 12px;
}

/* MAIN */

.game {
    max-width: 520px;
    margin: auto;
    padding: 14px 10px 100px;
    text-align: center;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.panel {
    background: #1e293b;
    border-radius: 18px;
    padding: 15px;
}

.result {
    white-space: pre-line;
    margin-top: 4px;
    min-height: 15px;
}

/* CASE LIST */

.case-list {
    display: grid;
    gap: 13px;
}

.case-card {
    background: #1e293b;
    border-radius: 18px;
    padding: 15px;
}

.case-name {
    font-size: 20px;
    font-weight: bold;
}

.case-price {
    margin: 7px 0;
    opacity: .8;
}

.case-preview {
    display: flex;
    justify-content: center;
    gap: 5px;

    margin: 10px 0;

    overflow: hidden;
}

.preview-img {
    width: 50px;
    height: 50px;

    object-fit: contain;

    background: #0f172a;

    border-radius: 9px;

    padding: 2px;
}

.case-btn {
    width: 100%;

    border-radius: 12px;

    padding: 13px;

    background: #f59e0b;

    color: white;
}

.back-btn {
    width: 100%;

    border-radius: 12px;

    padding: 12px;

    background: #334155;

    color: white;

    margin-bottom: 10px;
}

/* CASE CONTROLS */

.case-controls {
    display: flex;

    gap: 6px;

    margin: 8px 0;
}

.case-count-btn {
    flex: 1;

    padding: 9px 4px;

    border-radius: 9px;

    background: #334155;

    color: white;
}

.case-count-btn.active {
    background: #f59e0b;
}

.speed-btn {
    width: 100%;

    padding: 9px;

    margin-bottom: 7px;

    border-radius: 10px;

    background: #334155;

    color: white;
}

.speed-btn.active {
    background: #7c3aed;
}

/* ROULETTE */

.roulette-container {
    position: relative;

    height: 155px;

    overflow: hidden;

    background: #0f172a;

    border: 2px solid #334155;

    border-radius: 16px;

    margin: 15px 0;
}

.roulette-pointer {
    position: absolute;

    z-index: 20;

    top: -2px;
    left: 50%;

    transform: translateX(-50%);

    color: #facc15;

    font-size: 30px;
}

.roulette-line {
    position: absolute;

    z-index: 10;

    top: 0;
    bottom: 0;
    left: 50%;

    width: 3px;

    transform: translateX(-50%);

    background: rgba(250,204,21,.6);
}

.roulette-track {
    height: 100%;

    display: flex;
    align-items: center;

    gap: 8px;

    padding-left: 10px;

    will-change: transform;
}

.roulette-item {
    flex: 0 0 116px;

    height: 128px;

    background: #1e293b;

    border: 2px solid #475569;

    border-radius: 13px;

    padding: 6px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.roulette-item img {
    width: 88px;
    height: 88px;

    object-fit: contain;
}

.roulette-name {
    width: 100%;

    font-size: 11px;

    font-weight: bold;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.spin-btn {
    width: 100%;

    border-radius: 12px;

    padding: 13px;

    background: #f59e0b;

    color: white;
}

/* CASE RESULT */

.quick-sell-btn,
.sell-all-btn {
    width: 100%;

    margin-top: 5px;

    padding: 10px;

    border-radius: 10px;

    background: #16a34a;

    color: white;

    font-size: 14px;
}

.case-win-text {
    margin-top: 4px;

    font-size: 11px;

    opacity: .7;
}

.case-win-name {
    font-size: 11px;
}

.case-win-price {
    font-size: 11px;

    color: #facc15;

    margin-left: 4px;
}

.multi-result {
    font-size: 11px;

    opacity: .78;

    margin-top: 5px;

    line-height: 1.45;
}

/* INVENTORY */

.inventory-item {
    display: flex;

    gap: 12px;

    text-align: left;

    background: #1e293b;

    border-radius: 16px;

    padding: 12px;

    margin: 10px 0;
}

.inventory-item.locked {
    opacity: .65;
}

.inventory-image {
    width: 82px;
    height: 82px;

    object-fit: contain;

    background: #0f172a;

    border-radius: 11px;

    padding: 3px;
}

.inventory-info {
    flex: 1;
}

.inventory-name {
    font-weight: bold;

    font-size: 17px;
}

.inventory-actions {
    display: flex;

    gap: 7px;

    margin-top: 8px;
}

.sell-btn,
.withdraw-btn {
    flex: 1;

    border-radius: 10px;

    padding: 10px 4px;

    color: white;
}

.sell-btn {
    background: #16a34a;
}

.withdraw-btn {
    background: #2563eb;
}

.locked-text {
    margin-top: 8px;

    color: #facc15;

    font-size: 13px;
}

/* UPGRADER */

.upgrade-grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 7px;
}

.upgrade-choice {
    background: #0f172a;

    border: 2px solid #334155;

    border-radius: 13px;

    padding: 6px;

    cursor: pointer;
}

.upgrade-choice.selected {
    border-color: #a855f7;

    box-shadow: 0 0 12px rgba(168,85,247,.5);
}

.upgrade-choice img {
    width: 70px;
    height: 70px;

    object-fit: contain;
}

.choice-name {
    font-size: 10px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.choice-price {
    font-size: 12px;

    color: #facc15;
}

.upgrade-wheel-wrap {
    position: relative;

    width: 220px;
    height: 220px;

    margin: 18px auto;
}

.upgrade-wheel {
    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        conic-gradient(
            #22c55e 0deg var(--green-angle),
            #ef4444 var(--green-angle) 360deg
        );

    border: 5px solid #475569;
}

.upgrade-wheel::after {
    content: "";

    position: absolute;

    width: 140px;
    height: 140px;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    background: #0f172a;

    border-radius: 50%;
}

.needle-rotor {
    position: absolute;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}

.upgrade-needle {
    position: absolute;

    top: 5px;
    left: 50%;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 35px solid #facc15;
}

.wheel-text {
    position: absolute;

    z-index: 5;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    font-size: 28px;

    font-weight: bold;
}

.upgrade-btn {
    width: 100%;

    border-radius: 12px;

    padding: 13px;

    background: #7c3aed;

    color: white;
}

/* MODAL */

.modal-overlay {
    position: fixed;

    z-index: 500;

    inset: 0;

    background: rgba(0,0,0,.72);

    display: none;

    align-items: flex-end;

    justify-content: center;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 100%;

    max-width: 520px;

    max-height: 90vh;

    overflow-y: auto;

    background: #1e293b;

    border-radius: 22px 22px 0 0;

    padding: 17px;
}

.modal-header {
    display: flex;

    justify-content: space-between;

    align-items: center;
}

.modal-title {
    font-size: 23px;

    font-weight: bold;
}

.close-btn {
    background: #334155;

    color: white;

    border-radius: 10px;

    padding: 8px 11px;
}

.text-input {
    width: 100%;

    border: none;

    border-radius: 12px;

    padding: 13px;

    font-size: 16px;

    margin: 7px 0;
}

.input-label {
    text-align: left;

    margin-top: 12px;

    margin-bottom: 2px;

    font-size: 13px;

    opacity: .8;
}

.time-row {
    display: grid;

    grid-template-columns: 1fr 1.3fr;

    gap: 8px;
}

.submit-btn {
    width: 100%;

    border-radius: 12px;

    padding: 14px;

    margin-top: 8px;

    background: #22c55e;

    color: white;
}

.withdraw-submit {
    background: #2563eb;
}

/* DEPOSIT */

.deposit-grid {
    display: grid;

    grid-template-columns: repeat(3,1fr);

    gap: 8px;

    margin-top: 15px;
}

.deposit-item {
    background: #0f172a;

    border: 2px solid #334155;

    border-radius: 14px;

    padding: 7px 5px;
}

.deposit-item img {
    width: 72px;
    height: 72px;

    object-fit: contain;
}

.deposit-item-name {
    font-size: 10px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.deposit-item-price {
    font-size: 12px;

    color: #22c55e;

    margin-top: 3px;
}

.quantity-controls {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 5px;

    margin-top: 6px;
}

.quantity-btn {
    width: 27px;
    height: 27px;

    border-radius: 7px;

    background: #334155;

    color: white;
}

.quantity-number {
    min-width: 20px;

    font-weight: bold;
}

.deposit-summary {
    background: #0f172a;

    border-radius: 13px;

    padding: 12px;

    margin: 15px 0;
}

/* MENU */

.bottom-menu {
    position: fixed;

    bottom: 0;
    left: 0;
    right: 0;

    display: flex;

    background: #1e293b;

    border-top: 1px solid #334155;

    z-index: 100;
}

.nav-btn {
    width: 33.333%;

    padding: 11px 3px;

    background: transparent;

    color: #94a3b8;
}

.nav-btn.active {
    background: #334155;

    color: white;
}

</style>

</head>

<body>

<div class="topbar">

<div class="logo">
🧠 Brainroter X
</div>

<div class="top-right">

<div class="balance-box">
💰 <span id="coins">0</span>
</div>

<button
    class="deposit-top-btn"
    onclick="openDepositModal()"
>
➕ Пополнить
</button>

</div>

</div>


<div class="game">

<!-- CASES -->

<div
    id="casesPage"
    class="page active"
>

<div id="caseList">
Загрузка...
</div>

<div
    id="activeCase"
    style="display:none"
>

<button
    class="back-btn"

>
← Назад
</button>

<div class="panel">

<h2 id="activeCaseName"></h2>

<div id="activeCasePrice"></div>

<div
    id="rouletteContainer"
    class="roulette-container"
>

<div class="roulette-pointer">
▼
</div>

<div class="roulette-line"></div>

<div
    id="rouletteTrack"
    class="roulette-track"
></div>

<button
    id="count1"
    class="case-count-btn active"
    onclick="setCaseCount(1)"
>
x1

>
x3

    id="count4"
    class="case-count-btn"
    onclick="setCaseCount(4)"
>
x4
</button>

    id="count5"
    class="case-count-btn"
    onclick="setCaseCount(5)"
>
x5
</button>

</div>

    id="speedButton"

>

>

</button>

<div
    id="caseResult"

</div>

</div>

</div>


<!-- UPGRADER -->

<div
    id="upgraderPage"
    class="page"
>

<div class="panel">

<h2>
⚡ Апгрейдер
</h2>

<p>
Выбери свой Brainrot
</p>

    id="sourceGrid"

<p>

Шанс:

0%

    onclick="upgradeItem()"

    id="upgradeResult"

></div>

<!-- INVENTORY -->

<div
    id="inventoryPage"
    class="page"
>

<h2>

<!-- MENU -->

<div class="bottom-menu">

    id="casesButton"

🎁<br>Кейсы

<script>

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();


let coins = 0;

let inventory = [];

let brainrots = [];

let cases = [];

let caseItems = [];


let selectedCase = null;

let selectedSourceId = null;

let selectedTargetId = null;

let selectedWithdrawItem = null;


let depositSelection = {};


let caseSpinning = false;

let upgrading = false;

let needleRotation = 0;


let caseOpenCount = 1;

let caseSpeed = 1;


const FUNCTION_URL =
"https://obbxdztisfeutsvljiek.supabase.co/functions/v1/telegram-player";


const BRAINROT_IMAGES = {

    "nuclearo dinossauro":
        "./nuclearo.png",

    "la grande":
        "./lagrande.webp",

    "tang tang keletang":
        "./tangtang.png",

    "lavadorito spinito":
        "./lavadorito.png",

    "garama and madundung":
        "./garama.png",

    "ketchuru and musturu":
        "./ketchuru.png",

    "los tangcitos":
        "./lostangcitos.png",

    "los tictacs":
        "./lostictacs.png",

    "cerberus":
        "./cerberus.png",

    "cash or card":
        "./cashorcard.png"

};


function normalizeName(name) {

    return String(
        name || ""
    )
        .trim()
        .toLowerCase();
}


function getImage(name) {

    return (
        BRAINROT_IMAGES[
            normalizeName(
                name
            )
        ] ||
        ""
    );
}


async function apiRequest(data) {

    const response =
        await fetch(
            FUNCTION_URL,
            {
                method:
                    "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        ...data,

                        initData:
                            tg.initData

                    })
            }
        );

    return await response.json();
}


/* LOAD */

async function loadPlayer() {

    try {

        const data =
            await apiRequest({

                action:
                    "get_player"

            });


        if (!data.ok) {

            document
                .getElementById(
                    "caseList"
                )
                .innerText =
                    "❌ " +
                    data.error;

            return;
        }


        coins =
            Number(
                data.coins
            );


        inventory =
            data.inventory ||
            [];


        brainrots =
            data.brainrots ||
            [];


        cases =
            data.cases ||
            [];


        caseItems =
            data.case_items ||
            [];


        updateBalance();

        renderCases();

        renderInventory();

        renderSourceGrid();

        renderDepositGrid();

    }

    catch (error) {

        console.log(error);


        document
            .getElementById(
                "caseList"
            )
            .innerText =
                "❌ Ошибка подключения";
    }
}


function updateBalance() {

    document
        .getElementById(
            "coins"
        )
        .innerText =
            coins;
}


/* PAGES */

function showPage(page) {

    [
        "casesPage",
        "upgraderPage",
        "inventoryPage"
    ]
    .forEach(
        id => {

            document
                .getElementById(
                    id
                )
                .classList
                .remove(
                    "active"
                );
        }
    );


    [
        "casesButton",
        "upgraderButton",
        "inventoryButton"
    ]
    .forEach(
        id => {

            document
                .getElementById(
                    id
                )
                .classList
                .remove(
                    "active"
                );
        }
    );


    document
        .getElementById(
            page +
            "Page"
        )
        .classList
        .add(
            "active"
        );


    document
        .getElementById(
            page +
            "Button"
        )
        .classList
        .add(
            "active"
        );


    if (
        page ===
        "inventory"
    ) {

        renderInventory();

    }


    if (
        page ===
        "upgrader"
    ) {

        renderSourceGrid();

        renderTargetGrid();

        updateUpgradeUI();

    }
}


/* CASE SETTINGS */

function setCaseCount(count) {

    caseOpenCount =
        count;


    [
        1,
        3,
        4,
        5
    ]
    .forEach(
        value => {

            const button =
                document
                    .getElementById(
                        "count" +
                        value
                    );


            if (!button) {
                return;
            }


            button
                .classList
                .toggle(
                    "active",
                    value ===
                    count

async function animateCase(
    winner
) {

    const track =
        document
            .getElementById(
                "rouletteTrack"
            );


    const container =
        document
            .getElementById(
                "rouletteContainer"
            );


    const items =
        getSelectedCaseItems();


    track.innerHTML =
        "";


    track.style.transition =
        "none";


    track.style.transform =
        "translateX(0px)";


    const winnerIndex =
        39;


    let winnerCard =
        null;


    for (
        let i = 0;
        i < 45;
        i++
    ) {

        let item;


        if (
            i ===
            winnerIndex
        ) {

            item = {
                brainrot_name:
                    winner.brainrot_name
            };

        }

        else {

            item =
                items[
                    Math.floor(
                        Math.random() *
                        items.length
                    )
                ];

        }


        const card =
            rouletteCard(
                item
            );


        if (
            i ===
            winnerIndex
        ) {

            winnerCard =
                card;

        }


        track
            .appendChild(
                card
            );

    }


    await new Promise(
        resolve =>
            requestAnimationFrame(
                () =>
                    requestAnimationFrame(
                        resolve
                    )
            )
    );


    if (!winnerCard) {
        return;
    }


    const winnerCenter =
        winnerCard.offsetLeft +
        winnerCard.offsetWidth /
        2;


    const containerCenter =
        container.clientWidth /
        2;


    const x =
        containerCenter -
        winnerCenter;


    const animationTime =
        4200 /
        caseSpeed;


    track.style.transition =
        `transform ${animationTime}ms cubic-bezier(.08,.68,.12,1)`;


    track.style.transform =
        `translateX(${x}px)`;


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                animationTime +
                150
            )
    );
}


async function openSelectedCase() {

    if (

    ) {
        return;
    }


    caseSpinning =
        true;


    const button =
        document
            .getElementById(
                "spinButton"
            );


    const result =
        document
            .getElementById(
                "caseResult"
            );


    const quick =
        document
            .getElementById(
                "quickSellArea"
            );


    button.disabled =
        true;


    quick.innerHTML =
        "";


    result.innerHTML =
        `🎰 Открываем ×${caseOpenCount}...`;


    const winners =
        [];


    let lastError =
        null;


    try {

        /*
        Запросы идут по одному.
        Так сервер каждый раз получает
        новый актуальный баланс.
        */

        for (
            let i = 0;
            i < caseOpenCount;
            i++
        ) {

            const data =
                await apiRequest({

                    action:
                        "open_case",

                    case_id:
                        selectedCase.id

                });


            if (!data.ok) {

                lastError =
                    data.error;


                if (
                    data.coins !==
                    undefined
                ) {

                    coins =
                        Number(
                            data.coins
                        );

                }


                break;
            }


            coins =
                Number(
                    data.coins
                );


            winners.push(
                data.item
            );


            inventory.unshift(
                data.item
            );

        }


        if (
            winners.length ===
            0
        ) {

            result.innerText =
                "❌ " +
                (
                    lastError ||
                    "Не удалось открыть кейс"
                );


            updateBalance();


            button.disabled =
                false;


            caseSpinning =
                false;


            return;
        }


        /*
        Для рулетки используем
        последний реально выпавший предмет.
        */

        const rouletteWinner =
            winners[
                winners.length -
                1
            ];


        await animateCase(
            rouletteWinner
        );


        updateBalance();


        renderInventory();


        renderSourceGrid();


        /*
        ОДИН КЕЙС
        */

        if (
            winners.length ===
            1
        ) {

            const item =
                winners[0];


            quick.innerHTML = `

                <button
                    class="quick-sell-btn"
                    onclick="quickSellCaseItem(${item.id})"
                >

                </button>

            `;


            result.innerHTML = `

                <div class="case-win-text">

                    <span class="case-win-name">

                        ${item.brainrot_name}

                    </span>

                    <span class="case-win-price">

                        ${item.value} монет

                    </span>

                </div>

            `;

        }

        /*
        НЕСКОЛЬКО КЕЙСОВ
        */

        else {

            const totalValue =
                winners.reduce(
                    (
                        sum,
                        item
                    ) =>
                        sum +
                        Number(
                            item.value
                        ),
                    0
                );


            const ids =
                winners.map(
                    item =>
                        Number(
                            item.id
                        )
                );


            quick.innerHTML = `

                <button
                    class="sell-all-btn"
                    onclick='quickSellMany(${JSON.stringify(ids)})'
                >

                    ПРОДАТЬ ВСЁ ЗА ${totalValue}

                </button>

            `;


            const lines =
                winners
                    .map(
                        item =>
                            `${item.brainrot_name} — ${item.value}`
                    )
                    .join(
                        "<br>"
                    );


            result.innerHTML = `

                <div class="multi-result">

                    ${lines}

                </div>

            `;

        }


        /*
        Если не хватило денег на все,
        показываем это после выпавших.
        */

        if (
            winners.length <
            caseOpenCount &&
            lastError
        ) {

            result.innerHTML += `

                <div
                    style="
                        margin-top:5px;
                        color:#facc15;
                        font-size:11px;
                    "
                >

                    Открыто:
                    ${winners.length}
                    из
                    ${caseOpenCount}

                    <br>

                    ${lastError}

                </div>

            `;

        }

    }

    catch (error) {

        console.log(
            error
        );


        result.innerText =
            "❌ Ошибка подключения";

    }


    button.disabled =
        false;


    caseSpinning =
        false;
}

function calculateChance(
    source,
    target
) {

    if (
        !source ||
        !target
    ) {

        return 0;

    }


    let chance =
        Math.floor(
            (
                Number(
                    source.value
                ) /
                Number(
                    target.value
                )
            ) *
            100 *
            .75
        );


    chance =
        Math.min(
            chance,
            70
        );


    chance =
        Math.max(
            chance,
            0
        );


    return chance;
}


function updateUpgradeUI() {

    const chance =
        calculateChance(
            getSource(),
            getTarget()
        );


    document
        .getElementById(
            "chanceText"
        )
        .innerText =
            chance +
            "%";


    document
        .getElementById(
            "wheelText"
        )
        .innerText =
            chance +
            "%";


    document
        .getElementById(
            "upgradeWheel"
        )
        .style
        .setProperty(
            "--green-angle",
            chance *
            3.6 +
            "deg"
        );
}


function randomBetween(
    min,
    max
) {

    return (
        min +
        Math.random() *
        (
            max -
            min
        )
    );
}


async function spinNeedle(
    win,
    chance
) {

    const rotor =
        document
            .getElementById(
                "needleRotor"
            );


    const green =
        chance *
        3.6;


    let target;


    if (win) {

        target =
            green <=
            8

            ?

            green /
            2

            :

            randomBetween(
                4,
                green -
                4
            );

    }

    else {

        target =
            randomBetween(
                green +
                5,
                355
            );

    }


    const turns =
        2 +
        Math.floor(
            Math.random() *
            3
        );


    const current =
        (
            needleRotation %
            360 +
            360
        ) %
        360;


    const delta =
        (
            target -
            current +
            360
        ) %
        360;


    needleRotation +=

        turns *
        360

        +

        delta;


    rotor.style.transition =
        "transform 4s cubic-bezier(.12,.75,.12,1)";


    rotor.style.transform =
        `rotate(${needleRotation}deg)`;


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                4200
            )
    );
}

        );


        inventory =
            inventory.filter(
                item =>
                    Number(
                        item.id
                    ) !==
                    Number(
                        source.id
                    )
            );


        if (data.win) {

            inventory.unshift(
                data.item
            );


            result.innerText =
                "✅ УСПЕХ!\n" +
                source.brainrot_name +
                " → " +
                data.item.brainrot_name +
                "\nШанс: " +
                data.chance +
                "%";

        }

        else {

            result.innerText =
                "❌ ПРОИГРЫШ\n" +
                source.brainrot_name +
                " сгорел\nШанс: " +
                data.chance +
                "%";

        }


        selectedSourceId =
            null;


        selectedTargetId =
            null;


        renderInventory();


        renderSourceGrid();


        renderTargetGrid();


        updateUpgradeUI();

    }

    catch (error) {

        console.log(
            error
        );


        result.innerText =
            "❌ Ошибка подключения";

    }


    upgrading =
        false;


    button.disabled =
        false;
}


/* DEPOSIT */

function getGaramaValue() {

    const garama =
        brainrots.find(
            item => {


                const name =
                    normalizeName(
                        item.name
                    );


                return (
                    name.includes(
                        "garama"
                    ) &&
                    name.includes(
                        "madundung"
                    )
                );

            }
        );


    return garama

        ?

        Number(
            garama.value
        )

        :

        Infinity;
}


function getDepositBrainrots() {

    const min =
        getGaramaValue();


    return brainrots
        .filter(
            item =>
                Number(
                    item.value
                ) >=
                min
        )
        .sort(
            (
                a,
                b
            ) =>
                Number(
                    a.value
                ) -
                Number(
                    b.value
                )
        );
}


function renderDepositGrid() {

    const box =
        document
            .getElementById(
                "depositGrid"
            );


    box.innerHTML =
        "";


    getDepositBrainrots()
        .forEach(
            item => {


                const quantity =
                    Number(
                        depositSelection[
                            item.brainrot_id
                        ] ||
                        0
                    );


                const value =
                    Math.max(
                        0,
                        Number(
                            item.value
                        ) -
                        8
                    );


                const div =
                    document
                        .createElement(
                            "div"
                        );


                div.className =
                    "deposit-item";


                div.innerHTML = `

                    <img
                        src="${getImage(item.name)}"
                    >

                    <div class="deposit-item-name">

                        ${item.name}

                    </div>

                    <div class="deposit-item-price">

                        +${value} монет

                    </div>

                    <div class="quantity-controls">

                        <button
                            class="quantity-btn"
                            onclick="changeDepositQuantity(${item.brainrot_id}, -1)"
                        >

                            −

                        </button>

                        <span class="quantity-number">

                            ${quantity}

                        </span>

                        <button
                            class="quantity-btn"
                            onclick="changeDepositQuantity(${item.brainrot_id}, 1)"
                        >

                            +

                        </button>

                    </div>

                `;


                box
                    .appendChild(
                        div
                    );

            }
        );


    updateDepositSummary();
}


function getDepositCount() {

    return Object
        .values(
            depositSelection
        )
        .reduce(
            (
                sum,
                value
            ) =>
                sum +
                Number(
                    value
                ),
            0
        );
}


function changeDepositQuantity(
    brainrotId,
    delta
) {

    const current =
        Number(
            depositSelection[
                brainrotId
            ] ||
            0
        );


    if (
        delta >
        0 &&
        getDepositCount() >=
        10
    ) {

        alert(
            "Максимум 10 Brainrot"
        );

        return;

    }


    const next =
        Math.max(
            0,
            current +
            delta
        );


    if (
        next ===
        0
    ) {

        delete depositSelection[
            brainrotId
        ];

    }

    else {

        depositSelection[
            brainrotId
        ] =
            next;

    }


    renderDepositGrid();
}


function updateDepositSummary() {

    let total =
        0;


    Object
        .entries(
            depositSelection
        )
        .forEach(
            (
                [
                    brainrotId,
                    quantity
                ]
            ) => {


                const item =
                    brainrots.find(
                        b =>
                            Number(
                                b.brainrot_id
                            ) ===
                            Number(
                                brainrotId
                            )
                    );


                if (!item) {
                    return;
                }


                total +=
                    Math.max(
                        0,
                        Number(
                            item.value
                        ) -
                        8
                    ) *
                    Number(
                        quantity
                    );

            }
        );


    document
        .getElementById(
            "depositCount"
        )
        .innerText =
            getDepositCount();


    document
        .getElementById(
            "depositTotal"
        )
        .innerText =
            total;
}


function openDepositModal() {

    depositSelection =
        {};


    document
        .getElementById(
            "depositResult"
        )
        .innerText =
            "";


    renderDepositGrid();


    document
        .getElementById(
            "depositModal"
        )
        .classList
        .add(
            "show"
        );
}


function closeDepositModal() {

    document
        .getElementById(
            "depositModal"
        )
        .classList
        .remove(
            "show"
        );
}


async function submitDeposit() {

    const username =
        document
            .getElementById(
                "depositRoblox"
            )
            .value
            .trim();


    const result =
        document
            .getElementById(
                "depositResult"
            );


    const items =
        Object
            .entries(
                depositSelection
            )
            .filter(
                (
                    [
                        brainrotId,
                        quantity
                    ]
                ) =>
                    Number(
                        quantity
                    ) >
                    0
            )
            .map(
                (
                    [
                        brainrotId,
                        quantity
                    ]
                ) => ({

                    brainrot_id:
                        Number(
                            brainrotId
                        ),

                    quantity:
                        Number(
                            quantity
                        )

                })
            );


    if (!items.length) {

        result.innerText =
            "❌ Выбери Brainrot";

        return;

    }


    if (
        username.length <
        3
    ) {

        result.innerText =
            "❌ Введи Roblox ник";

        return;

    }


    result.innerText =
        "⏳ Отправляем заявку...";


    try {

        const data =
            await apiRequest({

                action:
                    "create_balance_request",

                roblox_username:
                    username,

                items:
                    items

            });


        if (!data.ok) {

            result.innerText =
                "❌ " +
                data.error;

            return;

        }


        result.innerText =
            "✅ Заявка #" +
            data.request_id +
            " отправлена.\n" +
            "Ожидай подтверждения администратора.";

    }

    catch (error) {

        console.log(
            error
        );


        result.innerText =
            "❌ Ошибка подключения";

    }
}

function buildWithdrawDate(
    day,
    clock
) {

    const parts =
        clock.split(":");


    if (
        parts.length !==
        2
    ) {

        return null;

    }


    const hour =
        Number(
            parts[0]
        );


    const minute =
        Number(
            parts[1]
        );


    if (
        day <
        1 ||
        day >
        31 ||
        hour <
        0 ||
        hour >
        23 ||
        minute <
        0 ||
        minute >
        59
    ) {

        return null;

    }


    const now =
        new Date();


    let year =
        now.getFullYear();


    let month =
        now.getMonth();


    let date =
        new Date(
            year,
            month,
            day,
            hour,
            minute,
            0,
            0
        );


    if (
        date.getDate() !==
        day
    ) {

        return null;

    }


    if (
        date.getTime() <=
        now.getTime()
    ) {

        month +=
            1;


        if (
            month >
            11
        ) {

            month =
                0;


            year +=
                1;

        }


        date =
            new Date(
                year,
                month,
                day,
                hour,
                minute,
                0,
                0
            );


        if (
            date.getDate() !==
            day
        ) {

            return null;

        }

    }


    return date;
}


async function submitWithdraw() {

    if (!selectedWithdrawItem) {
        return;
    }


    const username =
        document
            .getElementById(
                "withdrawRoblox"
            )
            .value
            .trim();


    const day =
        Number(
            document
                .getElementById(
                    "withdrawDay"
                )
                .value
        );


    const clock =
        document
            .getElementById(
                "withdrawClock"
            )
            .value;


    const result =
        document
            .getElementById(
                "withdrawResult"
            );


    if (
        username.length <
        3
    ) {

        result.innerText =
            "❌ Введи Roblox ник";

        return;

    }


    if (
        !day ||
        day <
        1 ||
        day >
        31
    ) {

        result.innerText =
            "❌ Введи день от 1 до 31";

        return;

    }


    if (!clock) {

        result.innerText =
            "❌ Выбери время";

        return;

    }


    const requestedDate =
        buildWithdrawDate(
            day,
            clock
        );


    if (!requestedDate) {

        result.innerText =
            "❌ Такой даты нет";

        return;

    }


    result.innerText =
        "⏳ Создаём заявку...";


    try {

        const data =
            await apiRequest({

                action:
                    "create_withdraw_request",

                inventory_id:
                    selectedWithdrawItem.id,

                roblox_username:
                    username,

                requested_time:
                    requestedDate
                        .toISOString()

            });


        if (!data.ok) {

            result.innerText =
                "❌ " +
                data.error;

            return;

        }


        const item =
            inventory.find(
                x =>
                    Number(
                        x.id
                    ) ===
                    Number(
                        selectedWithdrawItem.id
                    )
            );


        if (item) {

            item.locked =
                true;

        }


        renderInventory();


        renderSourceGrid();


        result.innerText =
            "✅ Заявка #" +
            data.request_id +
            " создана.\n" +
            "Время: " +
            day +
            " в " +
            clock +
            "\n" +
            "Ожидай подтверждения администратора.";

    }

    catch (error) {

        console.log(
            error
        );


        result.innerText =
            "❌ Ошибка подключения";

    }
}
