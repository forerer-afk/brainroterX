<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brainroter X</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.game {
    max-width: 520px;
    margin: auto;
    padding: 18px 12px 105px;
    text-align: center;
}

.balance {
    font-size: 22px;
    font-weight: bold;
    margin: 15px 0;
}

.page { display: none; }
.page.active { display: block; }

.panel {
    background: #1e293b;
    border-radius: 20px;
    padding: 18px 12px;
}

/* CASE */

.roulette-container {
    position: relative;
    height: 155px;
    overflow: hidden;
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 16px;
    margin: 15px 0;
}

.roulette-pointer {
    position: absolute;
    z-index: 20;
    left: 50%;
    top: -2px;
    transform: translateX(-50%);
    color: #facc15;
    font-size: 30px;
}

.roulette-line {
    position: absolute;
    z-index: 10;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 3px;
    background: rgba(250,204,21,.6);
}

.roulette-track {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 10px;
    will-change: transform;
}

.roulette-item {
    flex: 0 0 116px;
    height: 128px;
    background: #1e293b;
    border-radius: 13px;
    border: 2px solid #475569;
    padding: 7px;
}

.roulette-item img {
    width: 88px;
    height: 88px;
    object-fit: contain;
}

.roulette-name {
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

button {
    border: none;
    border-radius: 13px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
}

.open {
    width: 92%;
    background: #f59e0b;
    color: white;
}

/* INVENTORY */

.item {
    background: #1e293b;
    border-radius: 16px;
    padding: 14px;
    margin: 12px 0;
    display: flex;
    gap: 12px;
    text-align: left;
}

.item img {
    width: 82px;
    height: 82px;
    object-fit: contain;
    background: #0f172a;
    border-radius: 12px;
}

.item-content { flex: 1; }

.sell {
    width: 100%;
    background: #16a34a;
    color: white;
}

/* UPGRADER */

.upgrade-card {
    background: #0f172a;
    border-radius: 16px;
    padding: 14px;
    margin: 10px 0;
}

.upgrade-card img {
    width: 100px;
    height: 100px;
    object-fit: contain;
}

select {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    margin: 8px 0;
    font-size: 16px;
}

.chance-wheel {
    width: 210px;
    height: 210px;
    border-radius: 50%;
    margin: 20px auto;
    position: relative;
    background:
        conic-gradient(
            #22c55e 0deg var(--green),
            #ef4444 var(--green) 360deg
        );
    transition: transform 3.5s cubic-bezier(.1,.7,.1,1);
}

.chance-wheel::after {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: #0f172a;
    top: 30px;
    left: 30px;
}

.wheel-pointer {
    font-size: 32px;
    margin-bottom: -10px;
    color: #facc15;
}

.chance-text {
    font-size: 28px;
    font-weight: bold;
    margin: 10px;
}

.upgrade-btn {
    width: 100%;
    background: #7c3aed;
    color: white;
}

.result {
    white-space: pre-line;
    margin-top: 15px;
    min-height: 45px;
}

/* MENU */

.bottom-menu {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: #1e293b;
    border-top: 1px solid #334155;
}

.nav-button {
    width: 33.33%;
    border-radius: 0;
    background: transparent;
    color: #94a3b8;
    padding: 11px 3px;
    font-size: 13px;
}

.nav-button.active {
    background: #334155;
    color: white;
}
</style>
</head>

<body>

<div class="game">

<h1>🧠 Brainroter X</h1>

<div class="balance">
💰 Баланс: <span id="coins">0</span>
</div>

<!-- CASES -->

<div id="casesPage" class="page active">
<div class="panel">

<h2>🎁 Starter Case</h2>
<p>Цена: 19 монет</p>

<div id="rouletteContainer" class="roulette-container">
<div class="roulette-pointer">▼</div>
<div class="roulette-line"></div>
<div id="rouletteTrack" class="roulette-track"></div>
</div>

<button class="open" onclick="openCase()">
🎰 КРУТИТЬ КЕЙС
</button>

<div id="caseResult" class="result"></div>

</div>
</div>

<!-- UPGRADER -->

<div id="upgraderPage" class="page">
<div class="panel">

<h2>⚡ Апгрейдер</h2>

<select id="sourceSelect" onchange="updateUpgradeUI()">
<option value="">Выбери свой Brainrot</option>
</select>

<div id="sourceCard" class="upgrade-card">
Исходный Brainrot не выбран
</div>

<select id="targetSelect" onchange="updateUpgradeUI()">
<option value="">Выбери цель</option>
</select>

<div id="targetCard" class="upgrade-card">
Целевой Brainrot не выбран
</div>

<div class="wheel-pointer">▼</div>

<div id="chanceWheel" class="chance-wheel"></div>

<div class="chance-text">
Шанс: <span id="chanceText">0%</span>
</div>

<button class="upgrade-btn" onclick="upgradeItem()">
⚡ АПГРЕЙД
</button>

<div id="upgradeResult" class="result"></div>

</div>
</div>

<!-- INVENTORY -->

<div id="inventoryPage" class="page">
<h2>🎒 Инвентарь</h2>
<div id="inventory"></div>
</div>

</div>

<div class="bottom-menu">

<button id="casesButton" class="nav-button active" onclick="showPage('cases')">
🎁<br>Кейсы
</button>

<button id="upgraderButton" class="nav-button" onclick="showPage('upgrader')">
⚡<br>Апгрейдер
</button>

<button id="inventoryButton" class="nav-button" onclick="showPage('inventory')">
🎒<br>Инвентарь
</button>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let coins = 0;
let inventory = [];
let brainrots = [];

const FUNCTION_URL =
"https://obbxdztisfeutsvljiek.supabase.co/functions/v1/telegram-player";

const BRAINROT_IMAGES = {
    1: "./nuclearo.png",
    2: "./lagrande.webp",
    3: "./tangtang.png",
    4: "./Lavadorito.jpg"
};

function getImage(id) {
    return BRAINROT_IMAGES[Number(id)] || "";
}

async function apiRequest(data) {
    const response = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            ...data,
            initData: tg.initData
        })
    });

    return await response.json();
}

function showPage(page) {

    ["casesPage","upgraderPage","inventoryPage"]
    .forEach(id =>
        document.getElementById(id).classList.remove("active")
    );

    ["casesButton","upgraderButton","inventoryButton"]
    .forEach(id =>
        document.getElementById(id).classList.remove("active")
    );

    document.getElementById(page + "Page").classList.add("active");
    document.getElementById(page + "Button").classList.add("active");

    if (page === "inventory") renderInventory();
    if (page === "upgrader") renderUpgradeSelectors();
}

async function loadPlayer() {

    const data = await apiRequest({
        action: "get_player"
    });

    if (!data.ok) {
        document.getElementById("caseResult").innerText =
            "❌ " + data.error;
        return;
    }

    coins = Number(data.coins);
    inventory = data.inventory || [];
    brainrots = data.brainrots || [];

    document.getElementById("coins").innerText = coins;

    renderInventory();
    renderUpgradeSelectors();
    createIdleRoulette();
}

function renderInventory() {

    const box = document.getElementById("inventory");

    if (!inventory.length) {
        box.innerHTML = "У тебя пока нет Brainrot";
        return;
    }

    box.innerHTML = "";

    inventory.forEach(item => {

        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
            <img src="${getImage(item.brainrot_id)}">

            <div class="item-content">

                <b>${item.brainrot_name}</b><br>

                💰 ${item.value}<br>
                ⭐ ${item.rarity}

                <br><br>

                <button
                    class="sell"
                    onclick="sellItem(${item.id})"
                >
                    ПРОДАТЬ ЗА ${item.value}
                </button>

            </div>
        `;

        box.appendChild(div);
    });
}

async function sellItem(id) {

    const data = await apiRequest({
        action: "sell_item",
        inventory_id: id
    });

    if (!data.ok) {
        alert(data.error);
        return;
    }

    coins = Number(data.coins);

    inventory =
        inventory.filter(
            x => Number(x.id) !== Number(id)
        );

    document.getElementById("coins").innerText = coins;

    renderInventory();
    renderUpgradeSelectors();
}

/* CASE */

const ROULETTE_ITEMS = [
    {brainrot_id:1,name:"Nuclearo Dinossauro",rarity:"Common"},
    {brainrot_id:2,name:"La Grande",rarity:"Rare"},
    {brainrot_id:3,name:"Tang Tang Keletang",rarity:"Epic"},
    {brainrot_id:4,name:"Lavadorito Spinito",rarity:"Secret"}
];

function rouletteCard(item) {

    const div = document.createElement("div");

    div.className = "roulette-item";

    div.innerHTML = `
        <img src="${getImage(item.brainrot_id)}">
        <div class="roulette-name">${item.name}</div>
    `;

    return div;
}

function createIdleRoulette() {

    const track =
        document.getElementById("rouletteTrack");

    track.innerHTML = "";

    for (let i = 0; i < 8; i++) {
        track.appendChild(
            rouletteCard(
                ROULETTE_ITEMS[i % ROULETTE_ITEMS.length]
            )
        );
    }
}

async function animateCase(winner) {

    const track =
        document.getElementById("rouletteTrack");

    const container =
        document.getElementById("rouletteContainer");

    track.innerHTML = "";
    track.style.transition = "none";
    track.style.transform = "translateX(0px)";

    const winnerIndex = 35;

    for (let i = 0; i < 42; i++) {

        let item;

        if (i === winnerIndex) {

            item = {
                brainrot_id: winner.brainrot_id,
                name: winner.brainrot_name,
                rarity: winner.rarity
            };

        } else {

            item =
                ROULETTE_ITEMS[
                    Math.floor(
                        Math.random() *
                        ROULETTE_ITEMS.length
                    )
                ];

        }

        track.appendChild(
            rouletteCard(item)
        );
    }

    await new Promise(r => setTimeout(r,50));

    const step = 124;

    const translate =
        container.clientWidth / 2 -
        (winnerIndex * step + 58);

    track.style.transition =
        "transform 4s cubic-bezier(.1,.7,.1,1)";

    track.style.transform =
        `translateX(${translate}px)`;

    await new Promise(r => setTimeout(r,4200));
}

async function openCase() {

    const result =
        document.getElementById("caseResult");

    result.innerText =
        "🎰 Крутим...";

    const data =
        await apiRequest({
            action: "open_case",
            case_id: 1
        });

    if (!data.ok) {
        result.innerText =
            "❌ " + data.error;
        return;
    }

    await animateCase(data.item);

    coins =
        Number(data.coins);

    inventory.unshift(
        data.item
    );

    document.getElementById("coins").innerText = coins;

    renderInventory();
    renderUpgradeSelectors();

    result.innerText =
        "🎉 Выпал " +
        data.item.brainrot_name;
}

/* UPGRADER */

function renderUpgradeSelectors() {

    const source =
        document.getElementById("sourceSelect");

    const target =
        document.getElementById("targetSelect");

    const oldSource = source.value;
    const oldTarget = target.value;

    source.innerHTML =
        '<option value="">Выбери свой Brainrot</option>';

    target.innerHTML =
        '<option value="">Выбери цель</option>';

    inventory.forEach(item => {

        const option =
            document.createElement("option");

        option.value = item.id;

        option.textContent =
            `${item.brainrot_name} — ${item.value}`;

        source.appendChild(option);
    });

    brainrots.forEach(item => {

        const option =
            document.createElement("option");

        option.value =
            item.brainrot_id;

        option.textContent =
            `${item.name} — ${item.value}`;

        target.appendChild(option);
    });

    source.value = oldSource;
    target.value = oldTarget;

    updateUpgradeUI();
}

function getSelectedSource() {

    const id =
        Number(
            document.getElementById("sourceSelect").value
        );

    return inventory.find(
        x => Number(x.id) === id
    );
}

function getSelectedTarget() {

    const id =
        Number(
            document.getElementById("targetSelect").value
        );

    return brainrots.find(
        x => Number(x.brainrot_id) === id
    );
}

function calculateChance(source,target) {

    if (!source || !target) return 0;

    if (
        Number(target.value) <=
        Number(source.value)
    ) return 0;

    let chance =
        Math.ceil(
            Number(source.value) /
            Number(target.value) *
            100
        );

    return Math.min(chance,70);
}

function updateUpgradeUI() {

    const source =
        getSelectedSource();

    const target =
        getSelectedTarget();

    const sourceCard =
        document.getElementById("sourceCard");

    const targetCard =
        document.getElementById("targetCard");

    if (source) {

        sourceCard.innerHTML = `
            <img src="${getImage(source.brainrot_id)}">
            <br>
            <b>${source.brainrot_name}</b>
            <br>
            💰 ${source.value}
        `;

    } else {

        sourceCard.innerHTML =
            "Исходный Brainrot не выбран";
    }

    if (target) {

        targetCard.innerHTML = `
            <img src="${getImage(target.brainrot_id)}">
            <br>
            <b>${target.name}</b>
            <br>
            💰 ${target.value}
        `;

    } else {

        targetCard.innerHTML =
            "Целевой Brainrot не выбран";
    }

    const chance =
        calculateChance(source,target);

    document.getElementById("chanceText").innerText =
        chance + "%";

    document.getElementById("chanceWheel")
        .style
        .setProperty(
            "--green",
            chance * 3.6 + "deg"
        );
}

async function spinUpgradeWheel(win,chance) {

    const wheel =
        document.getElementById("chanceWheel");

    const random =
        Math.floor(Math.random() * 360);

    let finalAngle;

    if (win) {

        const greenAngle =
            Math.max(
                5,
                chance * 3.6 - 5
            );

        finalAngle =
            360 * 6 +
            Math.random() *
            greenAngle;

    } else {

        const greenAngle =
            chance * 3.6;

        finalAngle =
            360 * 6 +
            greenAngle +
            Math.random() *
            Math.max(
                5,
                360 - greenAngle - 5
            );
    }

    wheel.style.transition =
        "transform 3.5s cubic-bezier(.1,.7,.1,1)";

    wheel.style.transform =
        `rotate(${finalAngle}deg)`;

    await new Promise(r =>
        setTimeout(r,3700)
    );
}

async function upgradeItem() {

    const source =
        getSelectedSource();

    const target =
        getSelectedTarget();

    const result =
        document.getElementById("upgradeResult");

    if (!source) {
        result.innerText =
            "❌ Выбери свой Brainrot";
        return;
    }

    if (!target) {
        result.innerText =
            "❌ Выбери цель";
        return;
    }

    if (
        Number(target.value) <=
        Number(source.value)
    ) {
        result.innerText =
            "❌ Цель должна быть дороже";
        return;
    }

    result.innerText =
        "⚡ Апгрейд...";

    const data =
        await apiRequest({
            action: "upgrade_item",
            inventory_id: source.id,
            target_brainrot_id:
                target.brainrot_id
        });

    if (!data.ok) {

        result.innerText =
            "❌ " + data.error;

        return;
    }

    await spinUpgradeWheel(
        data.win,
        data.chance
    );

    inventory =
        inventory.filter(
            x =>
                Number(x.id) !==
                Number(source.id)
        );

    if (data.win) {

        inventory.unshift(
            data.item
        );

        result.innerText =
            "✅ УСПЕХ!\n" +
            source.brainrot_name +
            " → " +
            data.item.brainrot_name;

    } else {

        result.innerText =
            "❌ ПРОИГРЫШ\n" +
            source.brainrot_name +
            " сгорел";

    }

    renderInventory();
    renderUpgradeSelectors();
}

loadPlayer();

</script>

</body>
</html>
