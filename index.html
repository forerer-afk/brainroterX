<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brainroter X</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    text-align: center;
}

.game {
    max-width: 500px;
    margin: auto;
    padding: 25px 15px;
}

h1 {
    margin-bottom: 10px;
}

.balance {
    font-size: 20px;
    margin: 20px;
}

.case {
    background: #1f2937;
    border-radius: 20px;
    padding: 30px 15px;
    margin-top: 20px;
}

.case-icon {
    font-size: 80px;
}

button {
    width: 90%;
    padding: 16px;
    margin: 10px;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.open {
    background: #f59e0b;
    color: white;
}

.result {
    font-size: 28px;
    margin-top: 25px;
    min-height: 40px;
}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="game">

    <h1>🧠 Brainroter X</h1>

    <div class="balance">
        💰 Монеты: <span id="coins">0</span>
    </div>

    <div class="case">

        <div class="case-icon">🎁</div>

        <h2>Brainrot Case</h2>

        <p>Цена открытия: 19 монет</p>

        <button class="open" onclick="openCase()">
            🎰 КРУТИТЬ КЕЙС
        </button>

        <div class="result" id="result"></div>

    </div>

</div>

<script>
<script>
const tg = window.Telegram.WebApp;
tg.ready();

let coins = 0;

// ВАЖНО: сюда оставь СВОЮ настоящую ссылку Edge Function
const FUNCTION_URL = "ТВОЯ_ССЫЛКА_НА_TELEGRAM_PLAYER";


async function loadPlayer() {
    try {
        const response = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "get_player",
                initData: tg.initData
            })
        });

        const data = await response.json();

        if (data.ok) {
            coins = data.coins;
            document.getElementById("coins").innerText = coins;
        } else {
            console.log("Ошибка загрузки:", data.error);
        }

    } catch (error) {
        console.log("Ошибка подключения:", error);
    }
}


async function openCase() {
    const result = document.getElementById("result");

    result.innerText = "🎰 КРУТИТСЯ...";

    try {
        const response = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "open_case",
                case_id: 1,
                initData: tg.initData
            })
        });

        const data = await response.json();

        if (!data.ok) {
            result.innerText = "❌ " + data.error;

            if (data.coins !== undefined) {
                coins = data.coins;
                document.getElementById("coins").innerText = coins;
            }

            return;
        }

        coins = data.coins;
        document.getElementById("coins").innerText = coins;

        result.innerText =
            "🎉 Выпал: " + data.item.brainrot_name +
            "\n⭐ " + data.item.rarity;

    } catch (error) {
        result.innerText = "❌ Ошибка подключения";
        console.log(error);
    }
}


loadPlayer();
</script>
</body>
</html>
