<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brainroter X</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    text-align: center;
}

.game {
    max-width: 500px;
    margin: auto;
    padding: 25px 15px;
}

h1 {
    margin-bottom: 10px;
}

.balance {
    font-size: 20px;
    margin: 20px;
}

.case {
    background: #1f2937;
    border-radius: 20px;
    padding: 30px 15px;
    margin-top: 20px;
}

.case-icon {
    font-size: 80px;
}

button {
    width: 90%;
    padding: 16px;
    margin: 10px;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.open {
    background: #f59e0b;
    color: white;
}

.result {
    font-size: 28px;
    margin-top: 25px;
    min-height: 40px;
}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="game">

    <h1>🧠 Brainroter X</h1>

    <div class="balance">
        💰 Монеты: <span id="coins">0</span>
    </div>

    <div class="case">

        <div class="case-icon">🎁</div>

        <h2>Brainrot Case</h2>

        <p>Цена открытия: 19 монет</p>

        <button class="open" onclick="openCase()">
            🎰 КРУТИТЬ КЕЙС
        </button>

        <div class="result" id="result"></div>

    </div>

</div>

<script>

let coins = 0;

const brainrots = [
    {name: "🧠 Tralalero Tralala", chance: 50},
    {name: "🦈 Tralalita", chance: 30},
    {name: "🐊 Crocodilo", chance: 15},
    {name: "👑 Secret Brainrot", chance: 99}
];

function openCase() {

    if (coins < 19) {
        document.getElementById("result").innerText =
            "❌ Недостаточно монет!";
        return;
    }

    coins -= 19;

    document.getElementById("coins").innerText = coins;

    const result = document.getElementById("result");

    result.innerText = "🎰 КРУТИТСЯ...";

    setTimeout(() => {

        const random = Math.random() * 19;

        let total = 0;
        let winner = null;

        for (const brainrot of brainrots) {

            total += brainrot.chance;

            if (random <= total) {
                winner = brainrot;
                break;
            }
        }

        result.innerText = "🎉 Выпал: " + winner.name;

    }, 2000);
}

const tg = window.Telegram.WebApp;
tg.ready();

const telegramUser = tg.initDataUnsafe.user;

if (telegramUser) {
    console.log("Telegram ID:", telegramUser.id);
    console.log("Имя:", telegramUser.first_name);
}
const FUNCTION_URL = "https://obbxdztisfeutsvljiek.supabase.co/functions/v1/telegram-player";

async function loadPlayer() {
    const response = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            action: "get_player",
            initData: tg.initData
        })
    });

    const data = await response.json();

    if (data.ok) {
        coins = data.coins;
        document.getElementById("coins").innerText = coins;

        console.log("Инвентарь:", data.inventory);
    } else {
        console.log("Ошибка:", data.error);
    }
}

loadPlayer();
</script>
</body>
</html>
