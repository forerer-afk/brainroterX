<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brainroter X</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    overflow-x: hidden;
}

.game {
    max-width: 520px;
    margin: auto;
    padding: 18px 12px 105px;
    text-align: center;
}

h1 {
    margin: 5px 0 10px;
}

.balance {
    font-size: 22px;
    font-weight: bold;
    margin: 17px 0;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

/* CASE */

.case {
    background: #1e293b;
    border-radius: 20px;
    padding: 22px 12px;
    overflow: hidden;
}

.case-title {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 5px;
}

.case-price {
    opacity: 0.8;
    margin-bottom: 18px;
}

/* ROULETTE */

.roulette-container {
    position: relative;
    width: 100%;
    height: 155px;
    overflow: hidden;

    background: #0f172a;

    border-radius: 16px;
    border: 2px solid #334155;

    margin: 15px 0 20px;
}

.roulette-pointer {
    position: absolute;
    z-index: 20;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    color: #facc15;
    font-size: 30px;
}

.roulette-line {
    position: absolute;
    z-index: 10;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    transform: translateX(-50%);
    background: rgba(250, 204, 21, 0.55);
}

.roulette-track {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 10px;
    transform: translateX(0);
    will-change: transform;
}

.roulette-item {
    flex: 0 0 116px;
    height: 128px;

    background: #1e293b;

    border-radius: 13px;
    border: 2px solid #475569;

    padding: 7px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.roulette-item img {
    width: 88px;
    height: 88px;
    object-fit: contain;
}

.roulette-name {
    width: 100%;
    margin-top: 5px;
    font-size: 11px;
    font-weight: bold;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

/* RARITY */

.Common {
    border-color: #94a3b8;
}

.Rare {
    border-color: #3b82f6;
}

.Epic {
    border-color: #a855f7;
}

.Legendary {
    border-color: #f59e0b;
}

.Secret {
    border-color: #ef4444;
    box-shadow: 0 0 12px rgba(239,68,68,0.5);
}

/* BUTTONS */

button {
    border: none;
    border-radius: 13px;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.open {
    width: 92%;
    max-width: 360px;
    background: #f59e0b;
    color: white;
}

.open:disabled {
    opacity: 0.5;
}

.result {
    white-space: pre-line;
    min-height: 50px;
    margin-top: 18px;
    font-size: 19px;
    font-weight: bold;
}

/* INVENTORY */

.inventory-title {
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 18px;
}

.item {
    background: #1e293b;
    border-radius: 16px;
    margin: 12px 0;
    padding: 14px;

    display: flex;
    gap: 13px;

    text-align: left;
}

.item-avatar {
    width: 82px;
    height: 82px;
    object-fit: contain;
    background: #0f172a;
    border-radius: 12px;
    padding: 4px;
}

.item-content {
    flex: 1;
}

.item-name {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 5px;
}

.item-info {
    opacity: 0.85;
    line-height: 1.45;
    margin-bottom: 9px;
}

.sell {
    width: 100%;
    background: #16a34a;
    color: white;
}

.empty {
    background: #1e293b;
    border-radius: 16px;
    padding: 25px;
    opacity: 0.75;
}

/* UPGRADER */

.upgrader {
    background: #1e293b;
    border-radius: 20px;
    padding: 20px 14px;
}

.upgrader-title {
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 18px;
}

.upgrade-selected {
    background: #0f172a;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 15px;
}

.upgrade-selected img {
    width: 100px;
    height: 100px;
    object-fit: contain;
}

.upgrade-name {
    font-size: 20px;
    font-weight: bold;
    margin-top: 8px;
}

.upgrade-current {
    opacity: 0.8;
    margin-top: 5px;
}

.upgrade-select {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    margin-bottom: 12px;
    font-size: 16px;
}

.target-input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 18px;
    text-align: center;
    margin: 10px 0;
}

.chance-box {
    font-size: 24px;
    font-weight: bold;
    margin: 15px 0;
}

.chance-circle {
    width: 170px;
    height: 170px;

    margin: 18px auto;

    border-radius: 50%;

    background:
        conic-gradient(
            #22c55e 0deg,
            #22c55e var(--chance-angle),
            #334155 var(--chance-angle),
            #334155 360deg
        );

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}

.chance-circle::after {
    content: "";

    width: 125px;
    height: 125px;

    background: #0f172a;

    border-radius: 50%;

    position: absolute;
}

.chance-number {
    position: relative;
    z-index: 2;

    font-size: 29px;
    font-weight: bold;
}

.upgrade-button {
    width: 100%;
    background: #7c3aed;
    color: white;
}

.upgrade-button:disabled {
    opacity: 0.5;
}

/* BOTTOM MENU */

.bottom-menu {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;

    z-index: 100;

    display: flex;
    justify-content: center;

    background: #1e293b;
    border-top: 1px solid #334155;

    padding-bottom: env(safe-area-inset-bottom);
}

.nav-button {
    width: 33.333%;
    max-width: 180px;

    margin: 0;

    padding: 10px 3px;

    border-radius: 0;

    background: transparent;

    color: #94a3b8;

    font-size: 13px;
}

.nav-button.active {
    background: #334155;
    color: white;
}

.nav-icon {
    display: block;
    font-size: 22px;
    margin-bottom: 2px;
}

</style>

</head>

<body>

<div class="game">

<h1>🧠 Brainroter X</h1>

<div class="balance">
💰 Баланс: <span id="coins">0</span>
</div>

<!-- CASES -->

<div id="casesPage" class="page active">

<div class="case">

<div class="case-title">
🎁 Starter Case
</div>

<div class="case-price">
Цена: 19 монет
</div>

<div
    id="rouletteContainer"
    class="roulette-container"
>

<div class="roulette-pointer">
▼
</div>

<div class="roulette-line"></div>

<div
    id="rouletteTrack"
    class="roulette-track"
></div>

</div>

<button
    id="openButton"
    class="open"
    onclick="openCase()"
>
🎰 КРУТИТЬ КЕЙС
</button>

<div
    id="result"
    class="result"
></div>

</div>

</div>

<!-- UPGRADER -->

<div id="upgraderPage" class="page">

<div class="upgrader">

<div class="upgrader-title">
⚡ Апгрейдер
</div>

<select
    id="upgradeSelect"
    class="upgrade-select"
    onchange="selectUpgradeItem()"
>
<option value="">
Выбери Brainrot
</option>
</select>

<div
    id="upgradeSelected"
    class="upgrade-selected"
>

<div>
Сначала выбери Brainrot из инвентаря
</div>

</div>

<input
    id="targetValue"
    class="target-input"
    type="number"
    min="1"
    placeholder="Желаемая цена"
    oninput="updateUpgradeChance()"
>

<div class="chance-circle" id="chanceCircle">

<div
    id="chanceNumber"
    class="chance-number"
>
0%
</div>

</div>

<div class="chance-box">
Максимальный шанс: 70%
</div>

<button
    id="upgradeButton"
    class="upgrade-button"
    onclick="upgradeItem()"
>
⚡ АПГРЕЙД
</button>

<div
    id="upgradeResult"
    class="result"
></div>

</div>

</div>

<!-- INVENTORY -->

<div
    id="inventoryPage"
    class="page"
>

<div class="inventory-title">
🎒 Инвентарь
</div>

<div id="inventory">
Загрузка...
</div>

</div>

</div>

<!-- BOTTOM MENU -->

<div class="bottom-menu">

<button
    id="casesButton"
    class="nav-button active"
    onclick="showPage('cases')"
>

<span class="nav-icon">
🎁
</span>

Кейсы

</button>

<button
    id="upgraderButton"
    class="nav-button"
    onclick="showPage('upgrader')"
>

<span class="nav-icon">
⚡
</span>

Апгрейдер

</button>

<button
    id="inventoryButton"
    class="nav-button"
    onclick="showPage('inventory')"
>

<span class="nav-icon">
🎒
</span>

Инвентарь

</button>

</div>

<script>

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();

let coins = 0;
let inventory = [];
let spinning = false;

let selectedUpgradeItem = null;

const FUNCTION_URL =
"https://obbxdztisfeutsvljiek.supabase.co/functions/v1/telegram-player";

/* IMAGES */

const BRAINROT_IMAGES = {

    1: "./nuclearo.png",

    2: "./lagrande.webp",

    3: "./tangtang.png",

    4: "./Lavadorito.jpg"

};

/* ROULETTE ITEMS */

const ROULETTE_ITEMS = [

    {
        brainrot_id: 1,
        name: "Nuclearo Dinossauro",
        rarity: "Common"
    },

    {
        brainrot_id: 2,
        name: "La Grande",
        rarity: "Rare"
    },

    {
        brainrot_id: 3,
        name: "Tang Tang Keletang",
        rarity: "Epic"
    },

    {
        brainrot_id: 4,
        name: "Lavadorito Spinito",
        rarity: "Secret"
    }

];

function getBrainrotImage(
    brainrotId
) {

    return (
        BRAINROT_IMAGES[
            Number(brainrotId)
        ] || ""
    );

}

/* PAGES */

function showPage(page) {

    const pages = [
        "casesPage",
        "upgraderPage",
        "inventoryPage"
    ];

    const buttons = [
        "casesButton",
        "upgraderButton",
        "inventoryButton"
    ];

    pages.forEach(
        id =>
            document
                .getElementById(id)
                .classList
                .remove("active")
    );

    buttons.forEach(
        id =>
            document
                .getElementById(id)
                .classList
                .remove("active")
    );

    if (page === "cases") {

        document
            .getElementById("casesPage")
            .classList.add("active");

        document
            .getElementById("casesButton")
            .classList.add("active");

    }

    if (page === "upgrader") {

        document
            .getElementById("upgraderPage")
            .classList.add("active");

        document
            .getElementById("upgraderButton")
            .classList.add("active");

        renderUpgradeSelect();

    }

    if (page === "inventory") {

        document
            .getElementById("inventoryPage")
            .classList.add("active");

        document
            .getElementById("inventoryButton")
            .classList.add("active");

        renderInventory();

    }

}

/* API */

async function apiRequest(data) {

    const response =
        await fetch(

            FUNCTION_URL,

            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        ...data,

                        initData:
                            tg.initData

                    })

            }

        );

    return await response.json();

}

/* LOAD PLAYER */

async function loadPlayer() {

    try {

        const data =
            await apiRequest({
                action:
                    "get_player"
            });

        if (!data.ok) {

            document
                .getElementById(
                    "result"
                )
                .innerText =
                    "❌ " +
                    data.error;

            return;

        }

        coins =
            Number(
                data.coins
            );

        inventory =
            data.inventory || [];

        updateBalance();

        renderInventory();

        renderUpgradeSelect();

        createIdleRoulette();

    }

    catch (error) {

        console.log(error);

        document
            .getElementById(
                "result"
            )
            .innerText =
                "❌ Ошибка подключения";

    }

}

/* BALANCE */

function updateBalance() {

    document
        .getElementById(
            "coins"
        )
        .innerText =
            coins;

}

/* ROULETTE CARD */

function createRouletteCard(
    item
) {

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "roulette-item " +
        item.rarity;

    card.innerHTML = `

        <img
            src="${getBrainrotImage(item.brainrot_id)}"
            alt="${item.name}"
        >

        <div class="roulette-name">
            ${item.name}
        </div>

    `;

    return card;

}

/* IDLE ROULETTE */

function createIdleRoulette() {

    const track =
        document.getElementById(
            "rouletteTrack"
        );

    track.innerHTML = "";

    track.style.transition =
        "none";

    track.style.transform =
        "translateX(0px)";

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const item =
            ROULETTE_ITEMS[
                i %
                ROULETTE_ITEMS.length
            ];

        track.appendChild(
            createRouletteCard(
                item
            )
        );

    }

}

/* ANIMATE ROULETTE */

async function animateRoulette(
    winner
) {

    const track =
        document.getElementById(
            "rouletteTrack"
        );

    const container =
        document.getElementById(
            "rouletteContainer"
        );

    track.innerHTML = "";

    track.style.transition =
        "none";

    track.style.transform =
        "translateX(0px)";

    const totalCards = 45;

    const winnerIndex = 39;

    for (
        let i = 0;
        i < totalCards;
        i++
    ) {

        let item;

        if (
            i ===
            winnerIndex
        ) {

            item = {

                brainrot_id:
                    winner.brainrot_id,

                name:
                    winner.brainrot_name,

                rarity:
                    winner.rarity

            };

        }

        else {

            item =
                ROULETTE_ITEMS[
                    Math.floor(
                        Math.random() *
                        ROULETTE_ITEMS.length
                    )
                ];

        }

        track.appendChild(
            createRouletteCard(
                item
            )
        );

    }

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                50
            )
    );

    const cardWidth = 116;
    const gap = 8;
    const step =
        cardWidth + gap;

    const containerCenter =
        container.clientWidth / 2;

    const winnerCenter =
        winnerIndex * step +
        cardWidth / 2 +
        10;

    const randomOffset =
        Math.floor(
            Math.random() * 25
        ) - 12;

    const translateX =
        containerCenter -
        winnerCenter +
        randomOffset;

    track.style.transition =
        "transform 4.5s cubic-bezier(0.08, 0.65, 0.12, 1)";

    track.style.transform =
        `translateX(${translateX}px)`;

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                4700
            )
    );

}

/* OPEN CASE */

async function openCase() {

    if (spinning) {
        return;
    }

    spinning = true;

    const button =
        document.getElementById(
            "openButton"
        );

    const result =
        document.getElementById(
            "result"
        );

    button.disabled = true;

    result.innerText =
        "🎰 Открываем кейс...";

    try {

        const data =
            await apiRequest({

                action:
                    "open_case",

                case_id: 1

            });

        if (!data.ok) {

            if (
                data.coins !==
                undefined
            ) {

                coins =
                    Number(
                        data.coins
                    );

                updateBalance();

            }

            result.innerText =
                "❌ " +
                data.error;

            button.disabled =
                false;

            spinning =
                false;

            return;

        }

        await animateRoulette(
            data.item
        );

        coins =
            Number(
                data.coins
            );

        inventory.unshift(
            data.item
        );

        updateBalance();

        renderInventory();

        renderUpgradeSelect();

        result.innerText =

            "🎉 Выпал: " +

            data.item.brainrot_name +

            "\n⭐ " +

            data.item.rarity +

            "\n💰 Цена: " +

            data.item.value;

    }

    catch (error) {

        console.log(error);

        result.innerText =
            "❌ Ошибка подключения";

    }

    button.disabled =
        false;

    spinning =
        false;

}

/* INVENTORY */

function renderInventory() {

    const box =
        document.getElementById(
            "inventory"
        );

    if (
        !inventory ||
        inventory.length === 0
    ) {

        box.innerHTML = `

            <div class="empty">

                У тебя пока нет Brainrot 🧠

            </div>

        `;

        return;

    }

    box.innerHTML = "";

    inventory.forEach(
        item => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "item";

            element.innerHTML = `

                <img
                    class="item-avatar"
                    src="${getBrainrotImage(item.brainrot_id)}"
                    alt="${item.brainrot_name}"
                >

                <div class="item-content">

                    <div class="item-name">

                        🧠 ${item.brainrot_name}

                    </div>

                    <div class="item-info">

                        ⭐ ${item.rarity}

                        <br>

                        💰 Цена:
                        ${item.value}

                    </div>

                    <button
                        class="sell"
                        onclick="sellItem(${item.id})"
                    >

                        💰 ПРОДАТЬ ЗА
                        ${item.value}

                    </button>

                </div>

            `;

            box.appendChild(
                element
            );

        }
    );

}

/* SELL */

async function sellItem(
    inventoryId
) {

    const item =
        inventory.find(

            x =>
                Number(x.id) ===
                Number(inventoryId)

        );

    if (!item) {
        return;
    }

    try {

        const data =
            await apiRequest({

                action:
                    "sell_item",

                inventory_id:
                    inventoryId

            });

        if (!data.ok) {

            alert(
                "Ошибка: " +
                data.error
            );

            return;

        }

        coins =
            Number(
                data.coins
            );

        inventory =
            inventory.filter(

                x =>
                    Number(x.id) !==
                    Number(inventoryId)

            );

        updateBalance();

        renderInventory();

        renderUpgradeSelect();

    }

    catch (error) {

        console.log(error);

        alert(
            "Ошибка подключения"
        );

    }

}

/* UPGRADE SELECT */

function renderUpgradeSelect() {

    const select =
        document.getElementById(
            "upgradeSelect"
        );

    select.innerHTML = `

        <option value="">

            Выбери Brainrot

        </option>

    `;

    inventory.forEach(
        item => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                item.id;

            option.textContent =
                `${item.brainrot_name} — ${item.value} монет`;

            select.appendChild(
                option
            );

        }
    );

}

/* SELECT UPGRADE ITEM */

function selectUpgradeItem() {

    const select =
        document.getElementById(
            "upgradeSelect"
        );

    const inventoryId =
        Number(
            select.value
        );

    selectedUpgradeItem =
        inventory.find(

            item =>
                Number(item.id) ===
                inventoryId

        ) || null;

    const box =
        document.getElementById(
            "upgradeSelected"
        );

    if (
        !selectedUpgradeItem
    ) {

        box.innerHTML =
            "Сначала выбери Brainrot из инвентаря";

        updateUpgradeChance();

        return;

    }

    box.innerHTML = `

        <img
            src="${getBrainrotImage(selectedUpgradeItem.brainrot_id)}"
        >

        <div class="upgrade-name">

            🧠 ${selectedUpgradeItem.brainrot_name}

        </div>

        <div class="upgrade-current">

            Сейчас стоит:
            ${selectedUpgradeItem.value}
            монет

        </div>

    `;

    updateUpgradeChance();

}

/* CALCULATE CHANCE */

function calculateUpgradeChance(
    currentValue,
    targetValue
) {

    if (
        !currentValue ||
        !targetValue ||
        targetValue <=
        currentValue
    ) {

        return 0;

    }

    let chance =
        Math.ceil(

            (
                currentValue /
                targetValue
            ) *
            100

        );

    chance =
        Math.min(
            chance,
            70
        );

    chance =
        Math.max(
            chance,
            1
        );

    return chance;

}

/* UPDATE CHANCE */

function updateUpgradeChance() {

    const target =
        Number(
            document
                .getElementById(
                    "targetValue"
                )
                .value
        );

    let chance = 0;

    if (
        selectedUpgradeItem
    ) {

        chance =
            calculateUpgradeChance(

                Number(
                    selectedUpgradeItem.value
                ),

                target

            );

    }

    document
        .getElementById(
            "chanceNumber"
        )
        .innerText =
            chance + "%";

    const angle =
        chance * 3.6;

    document
        .getElementById(
            "chanceCircle"
        )
        .style
        .setProperty(

            "--chance-angle",

            angle + "deg"

        );

}

/* UPGRADE */

async function upgradeItem() {

    const result =
        document.getElementById(
            "upgradeResult"
        );

    if (
        !selectedUpgradeItem
    ) {

        result.innerText =
            "❌ Сначала выбери Brainrot";

        return;

    }

    const targetValue =
        Math.floor(
            Number(
                document
                    .getElementById(
                        "targetValue"
                    )
                    .value
            )
        );

    if (
        !targetValue ||
        targetValue <=
        Number(
            selectedUpgradeItem.value
        )
    ) {

        result.innerText =
            "❌ Новая цена должна быть выше текущей";

        return;

    }

    const chance =
        calculateUpgradeChance(

            Number(
                selectedUpgradeItem.value
            ),

            targetValue

        );

    result.innerText =
        "⚡ Апгрейдим...\nШанс: " +
        chance +
        "%";

    document
        .getElementById(
            "upgradeButton"
        )
        .disabled =
            true;

    try {

        const data =
            await apiRequest({

                action:
                    "upgrade_item",

                inventory_id:
                    selectedUpgradeItem.id,

                target_value:
                    targetValue

            });

        if (!data.ok) {

            result.innerText =
                "❌ " +
                data.error;

            document
                .getElementById(
                    "upgradeButton"
                )
                .disabled =
                    false;

            return;

        }

        if (data.win) {

            const index =
                inventory.findIndex(

                    item =>
                        Number(item.id) ===
                        Number(
                            selectedUpgradeItem.id
                        )

                );

            if (index !== -1) {

                inventory[index] =
                    data.item;

            }

            selectedUpgradeItem =
                data.item;

            result.innerText =

                "✅ УСПЕХ!\n" +

                data.old_value +

                " → " +

                data.new_value +

                " монет\n" +

                "Шанс был: " +

                data.chance +

                "%";

        }

        else {

            inventory =
                inventory.filter(

                    item =>
                        Number(item.id) !==
                        Number(
                            selectedUpgradeItem.id
                        )

                );

            result.innerText =

                "❌ НЕУДАЧА\n" +

                selectedUpgradeItem.brainrot_name +

                " сгорел 😢\n" +

                "Шанс был: " +

                data.chance +

                "%";

            selectedUpgradeItem =
                null;

        }

        renderInventory();

        renderUpgradeSelect();

        selectUpgradeItem();

    }

    catch (error) {

        console.log(error);

        result.innerText =
            "❌ Ошибка подключения";

    }

    document
        .getElementById(
            "upgradeButton"
        )
        .disabled =
            false;

}

/* START */

loadPlayer();

</script>

</body>
</html>
