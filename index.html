<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brainroter X</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        .game {
            max-width: 500px;
            margin: auto;
            padding: 25px 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .balance {
            font-size: 20px;
            margin: 20px;
        }

        .case {
            background: #1f2937;
            border-radius: 20px;
            padding: 30px 15px;
            margin-top: 20px;
        }

        .case-icon {
            font-size: 80px;
        }

        button {
            width: 90%;
            max-width: 350px;
            padding: 16px;
            margin: 10px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .open {
            background: #f59e0b;
            color: white;
        }

        .result {
            white-space: pre-line;
            font-size: 22px;
            margin-top: 25px;
            min-height: 50px;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🧠 Brainroter X</h1>

    <div class="balance">
        💰 Монеты: <span id="coins">0</span>
    </div>

    <div class="case">

        <div class="case-icon">🎁</div>

        <h2>Starter Case</h2>

        <p>Цена открытия: 19 монет</p>

        <button class="open" onclick="openCase()">
            🎰 КРУТИТЬ КЕЙС
        </button>

        <div class="result" id="result"></div>

    </div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let coins = 0;

// ТВОЯ Edge Function
const FUNCTION_URL =
    "https://obbxdztisfeutsvljiek.supabase.co/functions/v1/telegram-player";


async function loadPlayer() {

    const result = document.getElementById("result");

    try {

        const response = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "get_player",
                initData: tg.initData
            })
        });

        const data = await response.json();

        if (!data.ok) {
            result.innerText = "❌ Ошибка загрузки: " + data.error;
            return;
        }

        coins = Number(data.coins);

        document.getElementById("coins").innerText = coins;

    } catch (error) {

        console.log(error);

        result.innerText =
            "❌ Не удалось подключиться к серверу";
    }
}


async function openCase() {

    const result = document.getElementById("result");

    result.innerText = "🎰 КРУТИТСЯ...";

    try {

        const response = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "open_case",
                case_id: 1,
                initData: tg.initData
            })
        });

        const data = await response.json();

        if (!data.ok) {

            if (data.coins !== undefined) {
                coins = Number(data.coins);
                document.getElementById("coins").innerText = coins;
            }

            result.innerText = "❌ " + data.error;

            return;
        }

        coins = Number(data.coins);

        document.getElementById("coins").innerText = coins;

        result.innerText =
            "🎉 Выпал: " +
            data.item.brainrot_name +
            "\n⭐ Редкость: " +
            data.item.rarity +
            "\n💰 Цена: " +
            data.item.value;

    } catch (error) {

        console.log(error);

        result.innerText =
            "❌ Ошибка подключения к серверу";
    }
}


loadPlayer();
</script>

</body>
</html>
