<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brainroter X</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    overflow-x: hidden;
}

.game {
    max-width: 520px;
    margin: auto;
    padding: 16px 10px 105px;
    text-align: center;
}

h1 {
    margin: 5px 0 10px;
}

.balance {
    font-size: 22px;
    font-weight: bold;
    margin: 15px 0;
}

.page {
    display: none;
    animation: fadePage .22s ease;
}

.page.active {
    display: block;
}

@keyframes fadePage {
    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.panel {
    background: #1e293b;
    border-radius: 20px;
    padding: 16px;
}

button {
    border: none;
    border-radius: 13px;
    padding: 13px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition:
        transform .15s ease,
        opacity .15s ease,
        background .15s ease;
}

button:active {
    transform: scale(.97);
}

button:disabled {
    opacity: .5;
}

.result {
    white-space: pre-line;
    margin-top: 15px;
    min-height: 40px;
}

/* =========================
   CASE LIST
========================= */

.case-list {
    display: grid;
    gap: 14px;
}

.case-card {
    background: #1e293b;
    border-radius: 18px;
    padding: 17px;
    transition: transform .18s ease;
}

.case-card:active {
    transform: scale(.985);
}

.case-name {
    font-size: 21px;
    font-weight: bold;
}

.case-price {
    margin: 8px 0 13px;
    opacity: .85;
}

.case-items-preview {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin: 10px 0 15px;
    overflow: hidden;
}

.preview-img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    background: #0f172a;
    border-radius: 10px;
    padding: 3px;
}

.case-open-btn {
    width: 100%;
    background: #f59e0b;
    color: white;
}

/* =========================
   CASE ROULETTE
========================= */

.back-btn {
    width: 100%;
    background: #334155;
    color: white;
    margin-bottom: 12px;
}

.roulette-container {
    position: relative;
    height: 155px;
    overflow: hidden;
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 16px;
    margin: 15px 0;
}

.roulette-pointer {
    position: absolute;
    z-index: 20;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    color: #facc15;
    font-size: 30px;
}

.roulette-line {
    position: absolute;
    z-index: 10;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    transform: translateX(-50%);
    background: rgba(250,204,21,.6);
}

.roulette-track {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 10px;
    will-change: transform;
}

.roulette-item {
    flex: 0 0 116px;
    height: 128px;
    background: #1e293b;
    border-radius: 13px;
    border: 2px solid #475569;
    padding: 7px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.roulette-item img {
    width: 88px;
    height: 88px;
    object-fit: contain;
}

.roulette-name {
    width: 100%;
    font-size: 11px;
    font-weight: bold;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.spin-btn {
    width: 100%;
    background: #f59e0b;
    color: white;
}

/* =========================
   INVENTORY
========================= */

.item {
    background: #1e293b;
    border-radius: 16px;
    padding: 14px;
    margin: 12px 0;

    display: flex;
    gap: 12px;

    text-align: left;
}

.item img {
    width: 82px;
    height: 82px;
    object-fit: contain;
    background: #0f172a;
    border-radius: 12px;
    padding: 4px;
}

.item-content {
    flex: 1;
}

.sell {
    width: 100%;
    background: #16a34a;
    color: white;
    margin-top: 8px;
}

/* =========================
   UPGRADER
========================= */

.upgrader-title {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 6px;
}

.upgrader-subtitle {
    opacity: .7;
    font-size: 14px;
    margin-bottom: 15px;
}

.upgrade-section-title {
    text-align: left;
    font-size: 16px;
    font-weight: bold;
    margin: 15px 2px 8px;
}

.upgrade-grid {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);
    gap: 8px;
}

.upgrade-choice {
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 14px;

    padding: 7px 5px;

    cursor: pointer;

    transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

.upgrade-choice:active {
    transform: scale(.95);
}

.upgrade-choice.selected {
    border-color: #a855f7;
    background: #172033;
    box-shadow:
        0 0 15px rgba(168,85,247,.5);
    transform: translateY(-2px);
}

.upgrade-choice img {
    width: 72px;
    height: 72px;
    object-fit: contain;
}

.choice-name {
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 3px;
}

.choice-price {
    color: #facc15;
    font-size: 12px;
    margin-top: 3px;
}

.upgrade-versus {
    display: grid;
    grid-template-columns:
        1fr 45px 1fr;
    align-items: center;
    gap: 5px;

    margin: 18px 0;
}

.selected-upgrade-card {
    min-height: 135px;
    background: #0f172a;
    border-radius: 16px;
    border: 2px solid #334155;
    padding: 10px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    transition:
        border-color .2s ease,
        transform .2s ease;
}

.selected-upgrade-card.ready {
    border-color: #7c3aed;
}

.selected-upgrade-card img {
    width: 85px;
    height: 85px;
    object-fit: contain;
}

.selected-name {
    font-size: 13px;
    font-weight: bold;
    margin-top: 5px;
}

.selected-price {
    color: #facc15;
    font-size: 13px;
    margin-top: 3px;
}

.arrow-between {
    font-size: 30px;
    color: #a855f7;
}

.chance-title {
    font-size: 22px;
    font-weight: bold;
    margin-top: 15px;
}

/* =========================
   UPGRADE WHEEL
========================= */

.upgrade-wheel-wrap {
    position: relative;
    width: 230px;
    height: 230px;
    margin: 18px auto;
}

.upgrade-wheel {
    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:
        conic-gradient(
            #22c55e 0deg var(--green-angle),
            #ef4444 var(--green-angle) 360deg
        );

    border: 5px solid #475569;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);
}

.upgrade-wheel::after {
    content: "";

    position: absolute;

    width: 145px;
    height: 145px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    background: #0f172a;

    border-radius: 50%;
}

.needle-rotor {
    position: absolute;
    inset: 0;

    z-index: 10;

    pointer-events: none;

    transform: rotate(0deg);
}

.upgrade-needle {
    position: absolute;

    top: 5px;
    left: 50%;

    transform:
        translateX(-50%);

    width: 0;
    height: 0;

    border-left:
        11px solid transparent;

    border-right:
        11px solid transparent;

    border-bottom:
        37px solid #facc15;

    filter:
        drop-shadow(
            0 0 6px
            rgba(250,204,21,.95)
        );
}

.wheel-center-text {
    position: absolute;

    z-index: 5;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 29px;
    font-weight: bold;
}

.upgrade-btn {
    width: 100%;
    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #9333ea
        );
    color: white;
    font-size: 17px;
}

/* =========================
   MENU
========================= */

.bottom-menu {
    position: fixed;

    bottom: 0;
    left: 0;
    right: 0;

    display: flex;

    background: #1e293b;

    border-top:
        1px solid #334155;

    z-index: 100;
}

.nav-button {
    width: 33.333%;

    border-radius: 0;

    background: transparent;

    color: #94a3b8;

    padding: 11px 3px;

    font-size: 13px;
}

.nav-button.active {
    background: #334155;
    color: white;
}

</style>

</head>

<body>

<div class="game">

<h1>🧠 Brainroter X</h1>

<div class="balance">
💰 Баланс:
<span id="coins">0</span>
</div>

<!-- =====================
     CASES
===================== -->

<div
    id="casesPage"
    class="page active"
>

<div id="caseList">
Загрузка кейсов...
</div>

<div
    id="activeCase"
    style="display:none"
>

<button
    class="back-btn"
    onclick="closeCase()"
>
← Назад к кейсам
</button>

<div class="panel">

<h2 id="activeCaseName">
Кейс
</h2>

<p id="activeCasePrice"></p>

<div
    id="rouletteContainer"
    class="roulette-container"
>

<div class="roulette-pointer">
▼
</div>

<div class="roulette-line"></div>

<div
    id="rouletteTrack"
    class="roulette-track"
></div>

</div>

<button
    id="spinButton"
    class="spin-btn"
    onclick="openSelectedCase()"
>
🎰 КРУТИТЬ
</button>

<div
    id="caseResult"
    class="result"
></div>

</div>

</div>

</div>

<!-- =====================
     UPGRADER
===================== -->

<div
    id="upgraderPage"
    class="page"
>

<div class="panel">

<div class="upgrader-title">
⚡ Апгрейдер
</div>

<div class="upgrader-subtitle">
Выбери свой Brainrot и цель
</div>

<div class="upgrade-section-title">
1. Выбери свой Brainrot
</div>

<div
    id="sourceGrid"
    class="upgrade-grid"
></div>


<div class="upgrade-versus">

<div
    id="selectedSourceCard"
    class="selected-upgrade-card"
>
Твой<br>Brainrot
</div>

<div class="arrow-between">
➜
</div>

<div
    id="selectedTargetCard"
    class="selected-upgrade-card"
>
Цель
</div>

</div>


<div class="upgrade-section-title">
2. Выбери более дорогой Brainrot
</div>

<div
    id="targetGrid"
    class="upgrade-grid"
></div>


<div class="chance-title">

Шанс:
<span id="chanceText">
0%
</span>

</div>


<div class="upgrade-wheel-wrap">

<div
    id="upgradeWheel"
    class="upgrade-wheel"
></div>


<div
    id="needleRotor"
    class="needle-rotor"
>

<div
    class="upgrade-needle"
></div>

</div>


<div
    id="wheelChanceText"
    class="wheel-center-text"
>
0%
</div>

</div>


<button
    id="upgradeButton"
    class="upgrade-btn"
    onclick="upgradeItem()"
>

⚡ АПГРЕЙД

</button>


<div
    id="upgradeResult"
    class="result"
></div>

</div>

</div>

<!-- =====================
     INVENTORY
===================== -->

<div
    id="inventoryPage"
    class="page"
>

<h2>🎒 Инвентарь</h2>

<div id="inventory"></div>

</div>

</div>

<!-- =====================
     MENU
===================== -->

<div class="bottom-menu">

<button
    id="casesButton"
    class="nav-button active"
    onclick="showPage('cases')"
>
🎁
<br>
Кейсы
</button>

<button
    id="upgraderButton"
    class="nav-button"
    onclick="showPage('upgrader')"
>
⚡
<br>
Апгрейдер
</button>

<button
    id="inventoryButton"
    class="nav-button"
    onclick="showPage('inventory')"
>
🎒
<br>
Инвентарь
</button>

</div>


<script>

/* =========================
   TELEGRAM
========================= */

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();

/* =========================
   VARIABLES
========================= */

let coins = 0;

let inventory = [];

let brainrots = [];

let cases = [];

let caseItems = [];

let selectedCase = null;

let selectedSourceId = null;

let selectedTargetBrainrotId = null;

let caseSpinning = false;

let upgrading = false;

let needleRotation = 0;


/* =========================
   SERVER
========================= */

const FUNCTION_URL =
"https://obbxdztisfeutsvljiek.supabase.co/functions/v1/telegram-player";


/* =========================
   IMAGES
========================= */

const BRAINROT_IMAGES = {

    "nuclearo dinossauro":
        "./nuclearo.png",

    "la grande":
        "./lagrande.webp",

    "tang tang keletang":
        "./tangtang.png",

    "lavadorito spinito":
        "./lavadorito.png",

    "garama and madundung":
        "./garama.png",

    "ketchuru and musturu":
        "./ketchuru.png",

    "los tangcitos":
        "./lostangcitos.png",

    "los tictacs":
        "./lostictacs.png",

    "cerberus":
        "./cerberus.png",

    "cash or card":
        "./cashorcard.png"

};


function normalizeName(name) {

    return String(
        name || ""
    )
    .trim()
    .toLowerCase();
}


function getImageByName(name) {

    const key =
        normalizeName(
            name
        );

    return (
        BRAINROT_IMAGES[key] ||
        ""
    );
}


/* =========================
   API
========================= */

async function apiRequest(data) {

    const response =
        await fetch(
            FUNCTION_URL,
            {
                method:
                    "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        ...data,

                        initData:
                            tg.initData
                    })
            }
        );

    return await response.json();
}


/* =========================
   LOAD
========================= */

async function loadPlayer() {

    try {

        const data =
            await apiRequest({
                action:
                    "get_player"
            });


        if (!data.ok) {

            document
                .getElementById(
                    "caseList"
                )
                .innerText =
                    "❌ " +
                    data.error;

            return;
        }


        coins =
            Number(
                data.coins
            );


        inventory =
            data.inventory ||
            [];


        brainrots =
            data.brainrots ||
            [];


        cases =
            data.cases ||
            [];


        caseItems =
            data.case_items ||
            [];


        updateBalance();

        renderCases();

        renderInventory();

        renderUpgradeSourceGrid();

    }

    catch (error) {

        console.log(
            error
        );


        document
            .getElementById(
                "caseList"
            )
            .innerText =
                "❌ Ошибка подключения";
    }
}


/* =========================
   BALANCE
========================= */

function updateBalance() {

    document
        .getElementById(
            "coins"
        )
        .innerText =
            coins;
}


/* =========================
   PAGES
========================= */

function showPage(page) {

    [
        "casesPage",
        "upgraderPage",
        "inventoryPage"
    ]
    .forEach(id => {

        document
            .getElementById(id)
            .classList
            .remove("active");

    });


    [
        "casesButton",
        "upgraderButton",
        "inventoryButton"
    ]
    .forEach(id => {

        document
            .getElementById(id)
            .classList
            .remove("active");

    });


    document
        .getElementById(
            page + "Page"
        )
        .classList
        .add("active");


    document
        .getElementById(
            page + "Button"
        )
        .classList
        .add("active");


    if (
        page ===
        "inventory"
    ) {

        renderInventory();

    }


    if (
        page ===
        "upgrader"
    ) {

        renderUpgradeSourceGrid();

        renderUpgradeTargetGrid();

        updateUpgradeUI();

    }

}


/* =====================================================
   CASE LIST
===================================================== */

function renderCases() {

    const box =
        document.getElementById(
            "caseList"
        );


    if (!cases.length) {

        box.innerHTML =
            "Кейсов пока нет";

        return;
    }


    box.innerHTML =
        "";


    const list =
        document.createElement(
            "div"
        );


    list.className =
        "case-list";


    cases.forEach(
        gameCase => {


            const items =
                caseItems.filter(
                    item =>
                        Number(
                            item.case_id
                        ) ===
                        Number(
                            gameCase.id
                        )
                );


            const preview =
                items
                .slice(0,5)
                .map(
                    item => `

                        <img
                            class="preview-img"
                            src="${getImageByName(item.brainrot_name)}"
                        >

                    `
                )
                .join("");


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "case-card";


            card.innerHTML = `

                <div class="case-name">

                    🎁 ${gameCase.name}

                </div>


                <div class="case-price">

                    💰 Цена:
                    ${gameCase.price}

                </div>


                <div class="case-items-preview">

                    ${preview}

                </div>


                <button
                    class="case-open-btn"
                    onclick="selectCase(${gameCase.id})"
                >

                    ОТКРЫТЬ КЕЙС

                </button>

            `;


            list.appendChild(
                card
            );

        }
    );


    box.appendChild(
        list
    );

}


/* =========================
   SELECT CASE
========================= */

function selectCase(caseId) {

    selectedCase =
        cases.find(
            gameCase =>
                Number(
                    gameCase.id
                ) ===
                Number(
                    caseId
                )
        );


    if (!selectedCase) {
        return;
    }


    document
        .getElementById(
            "caseList"
        )
        .style
        .display =
            "none";


    document
        .getElementById(
            "activeCase"
        )
        .style
        .display =
            "block";


    document
        .getElementById(
            "activeCaseName"
        )
        .innerText =
            "🎁 " +
            selectedCase.name;


    document
        .getElementById(
            "activeCasePrice"
        )
        .innerText =
            "Цена: " +
            selectedCase.price +
            " монет";


    document
        .getElementById(
            "caseResult"
        )
        .innerText =
            "";


    createIdleRoulette();

}


function closeCase() {

    selectedCase =
        null;


    document
        .getElementById(
            "caseList"
        )
        .style
        .display =
            "block";


    document
        .getElementById(
            "activeCase"
        )
        .style
        .display =
            "none";

}


/* =========================
   CASE ITEMS
========================= */

function getSelectedCaseItems() {

    if (!selectedCase) {

        return [];

    }


    return caseItems.filter(
        item =>
            Number(
                item.case_id
            ) ===
            Number(
                selectedCase.id
            )
    );

}


/* =========================
   ROULETTE
========================= */

function rouletteCard(item) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "roulette-item";


    div.innerHTML = `

        <img
            src="${getImageByName(item.brainrot_name)}"
        >


        <div class="roulette-name">

            ${item.brainrot_name}

        </div>

    `;


    return div;

}


function createIdleRoulette() {

    const track =
        document.getElementById(
            "rouletteTrack"
        );


    const items =
        getSelectedCaseItems();


    track.innerHTML =
        "";


    track.style.transition =
        "none";


    track.style.transform =
        "translateX(0px)";


    if (!items.length) {

        document
            .getElementById(
                "caseResult"
            )
            .innerText =
                "❌ В кейсе нет предметов";

        return;

    }


    for (
        let i = 0;
        i < 8;
        i++
    ) {

        track.appendChild(

            rouletteCard(

                items[
                    i %
                    items.length
                ]

            )

        );

    }

}


/* =========================
   CASE ANIMATION
========================= */

async function animateCase(
    winner
) {

    const track =
        document.getElementById(
            "rouletteTrack"
        );


    const container =
        document.getElementById(
            "rouletteContainer"
        );


    const items =
        getSelectedCaseItems();


    track.innerHTML =
        "";


    track.style.transition =
        "none";


    track.style.transform =
        "translateX(0px)";


    const totalCards =
        45;


    const winnerIndex =
        39;


    let winnerCard =
        null;


    for (
        let i = 0;
        i < totalCards;
        i++
    ) {


        let item;


        if (
            i ===
            winnerIndex
        ) {


            item = {

                brainrot_id:
                    winner.brainrot_id,

                brainrot_name:
                    winner.brainrot_name,

                rarity:
                    winner.rarity,

                value:
                    winner.value

            };

        }

        else {


            item =
                items[
                    Math.floor(
                        Math.random() *
                        items.length
                    )
                ];

        }


        const card =
            rouletteCard(
                item
            );


        if (
            i ===
            winnerIndex
        ) {

            winnerCard =
                card;

        }


        track.appendChild(
            card
        );

    }


    await new Promise(
        resolve => {

            requestAnimationFrame(
                () => {

                    requestAnimationFrame(
                        resolve
                    );

                }
            );

        }
    );


    if (!winnerCard) {
        return;
    }


    const winnerCenter =
        winnerCard.offsetLeft +
        winnerCard.offsetWidth /
        2;


    const containerCenter =
        container.clientWidth /
        2;


    const translateX =
        containerCenter -
        winnerCenter;


    track.style.transition =
        "transform 4.2s cubic-bezier(0.08,0.68,0.12,1)";


    track.style.transform =
        `translateX(${translateX}px)`;


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                4400
            )
    );

}


/* =========================
   OPEN CASE
========================= */

async function openSelectedCase() {

    if (
        !selectedCase ||
        caseSpinning
    ) {
        return;
    }


    const items =
        getSelectedCaseItems();


    if (!items.length) {

        document
            .getElementById(
                "caseResult"
            )
            .innerText =
                "❌ В этом кейсе нет предметов";

        return;

    }


    caseSpinning =
        true;


    const button =
        document.getElementById(
            "spinButton"
        );


    const result =
        document.getElementById(
            "caseResult"
        );


    button.disabled =
        true;


    result.innerText =
        "🎰 Крутим...";


    try {


        const data =
            await apiRequest({

                action:
                    "open_case",

                case_id:
                    selectedCase.id

            });


        if (!data.ok) {


            result.innerText =
                "❌ " +
                data.error;


            if (
                data.coins !==
                undefined
            ) {


                coins =
                    Number(
                        data.coins
                    );


                updateBalance();

            }


            button.disabled =
                false;


            caseSpinning =
                false;


            return;

        }


        await animateCase(
            data.item
        );


        coins =
            Number(
                data.coins
            );


        inventory.unshift(
            data.item
        );


        updateBalance();


        renderInventory();


        renderUpgradeSourceGrid();


        result.innerText =

            "🎉 Выпал: " +

            data.item.brainrot_name +

            "\n💰 Цена: " +

            data.item.value;

    }

    catch (error) {


        console.log(
            error
        );


        result.innerText =
            "❌ Ошибка подключения";

    }


    button.disabled =
        false;


    caseSpinning =
        false;

}


/* =====================================================
   INVENTORY
===================================================== */

function renderInventory() {

    const box =
        document.getElementById(
            "inventory"
        );


    if (!inventory.length) {


        box.innerHTML =
            "У тебя пока нет Brainrot";


        return;

    }


    box.innerHTML =
        "";


    inventory.forEach(
        item => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "item";


            div.innerHTML = `

                <img
                    src="${getImageByName(item.brainrot_name)}"
                >


                <div class="item-content">


                    <b>
                        ${item.brainrot_name}
                    </b>


                    <br>


                    💰 ${item.value}


                    <br>


                    ⭐ ${item.rarity}


                    <button
                        class="sell"
                        onclick="sellItem(${item.id})"
                    >

                        ПРОДАТЬ ЗА
                        ${item.value}

                    </button>


                </div>

            `;


            box.appendChild(
                div
            );

        }
    );

}


/* =========================
   SELL
========================= */

async function sellItem(id) {

    try {


        const data =
            await apiRequest({

                action:
                    "sell_item",

                inventory_id:
                    id

            });


        if (!data.ok) {


            alert(
                data.error
            );


            return;

        }


        coins =
            Number(
                data.coins
            );


        inventory =
            inventory.filter(
                item =>
                    Number(
                        item.id
                    ) !==
                    Number(
                        id
                    )
            );


        if (
            Number(
                selectedSourceId
            ) ===
            Number(
                id
            )
        ) {

            selectedSourceId =
                null;

            selectedTargetBrainrotId =
                null;

        }


        updateBalance();


        renderInventory();


        renderUpgradeSourceGrid();


        renderUpgradeTargetGrid();


        updateUpgradeUI();

    }

    catch (error) {


        console.log(
            error
        );


        alert(
            "Ошибка подключения"
        );

    }

}


/* =====================================================
   UPGRADER SOURCE CARDS
===================================================== */

function getSelectedSource() {

    if (
        !selectedSourceId
    ) {

        return null;

    }


    return inventory.find(
        item =>
            Number(
                item.id
            ) ===
            Number(
                selectedSourceId
            )
    ) || null;

}


function getSelectedTarget() {

    if (
        !selectedTargetBrainrotId
    ) {

        return null;

    }


    return brainrots.find(
        item =>
            Number(
                item.brainrot_id
            ) ===
            Number(
                selectedTargetBrainrotId
            )
    ) || null;

}


function renderUpgradeSourceGrid() {

    const box =
        document.getElementById(
            "sourceGrid"
        );


    if (!box) {
        return;
    }


    box.innerHTML =
        "";


    if (!inventory.length) {


        box.innerHTML =
            "В инвентаре нет Brainrot";


        return;

    }


    inventory.forEach(
        item => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "upgrade-choice";


            if (
                Number(
                    selectedSourceId
                ) ===
                Number(
                    item.id
                )
            ) {

                card.classList.add(
                    "selected"
                );

            }


            card.innerHTML = `

                <img
                    src="${getImageByName(item.brainrot_name)}"
                >

                <div class="choice-name">

                    ${item.brainrot_name}

                </div>

                <div class="choice-price">

                    💰 ${item.value}

                </div>

            `;


            card.onclick =
                () =>
                    selectUpgradeSource(
                        item.id
                    );


            box.appendChild(
                card
            );

        }
    );

}


function selectUpgradeSource(
    inventoryId
) {

    selectedSourceId =
        inventoryId;


    /*
    При выборе нового исходного
    сбрасываем старую цель.
    */

    selectedTargetBrainrotId =
        null;


    renderUpgradeSourceGrid();


    renderUpgradeTargetGrid();


    updateUpgradeUI();

}


/* =====================================================
   TARGET CARDS
===================================================== */

function renderUpgradeTargetGrid() {

    const box =
        document.getElementById(
            "targetGrid"
        );


    if (!box) {
        return;
    }


    box.innerHTML =
        "";


    const source =
        getSelectedSource();


    if (!source) {


        box.innerHTML =
            "Сначала выбери свой Brainrot";


        return;

    }


    const availableTargets =
        brainrots
            .filter(
                item =>
                    Number(
                        item.value
                    ) >
                    Number(
                        source.value
                    )
            )
            .sort(
                (
                    a,
                    b
                ) =>
                    Number(
                        a.value
                    ) -
                    Number(
                        b.value
                    )
            );


    if (
        !availableTargets.length
    ) {


        box.innerHTML =
            "Нет более дорогих Brainrot";


        return;

    }


    availableTargets.forEach(
        item => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "upgrade-choice";


            if (
                Number(
                    selectedTargetBrainrotId
                ) ===
                Number(
                    item.brainrot_id
                )
            ) {


                card.classList.add(
                    "selected"
                );

            }


            card.innerHTML = `

                <img
                    src="${getImageByName(item.name)}"
                >

                <div class="choice-name">

                    ${item.name}

                </div>

                <div class="choice-price">

                    💰 ${item.value}

                </div>

            `;


            card.onclick =
                () =>
                    selectUpgradeTarget(
                        item.brainrot_id
                    );


            box.appendChild(
                card
            );

        }
    );

}


function selectUpgradeTarget(
    brainrotId
) {

    selectedTargetBrainrotId =
        brainrotId;


    renderUpgradeTargetGrid();


    updateUpgradeUI();

}


/* =========================
   CHANCE
========================= */

function calculateChance(
    source,
    target
) {

    if (
        !source ||
        !target
    ) {

        return 0;

    }


    if (
        Number(
            target.value
        ) <=
        Number(
            source.value
        )
    ) {

        return 0;

    }


    let chance =
        Math.ceil(

            Number(
                source.value
            )

            /

            Number(
                target.value
            )

            *

            100

        );


    chance =
        Math.min(
            chance,
            70
        );


    chance =
        Math.max(
            chance,
            1
        );


    return chance;

}


/* =========================
   UPDATE UPGRADE UI
========================= */

function updateUpgradeUI() {

    const source =
        getSelectedSource();


    const target =
        getSelectedTarget();


    const sourceCard =
        document.getElementById(
            "selectedSourceCard"
        );


    const targetCard =
        document.getElementById(
            "selectedTargetCard"
        );


    if (source) {


        sourceCard.classList.add(
            "ready"
        );


        sourceCard.innerHTML = `

            <img
                src="${getImageByName(source.brainrot_name)}"
            >

            <div class="selected-name">

                ${source.brainrot_name}

            </div>

            <div class="selected-price">

                💰 ${source.value}

            </div>

        `;

    }

    else {


        sourceCard.classList.remove(
            "ready"
        );


        sourceCard.innerHTML =
            "Твой<br>Brainrot";

    }


    if (target) {


        targetCard.classList.add(
            "ready"
        );


        targetCard.innerHTML = `

            <img
                src="${getImageByName(target.name)}"
            >

            <div class="selected-name">

                ${target.name}

            </div>

            <div class="selected-price">

                💰 ${target.value}

            </div>

        `;

    }

    else {


        targetCard.classList.remove(
            "ready"
        );


        targetCard.innerHTML =
            "Цель";

    }


    const chance =
        calculateChance(
            source,
            target
        );


    document
        .getElementById(
            "chanceText"
        )
        .innerText =
            chance +
            "%";


    document
        .getElementById(
            "wheelChanceText"
        )
        .innerText =
            chance +
            "%";


    document
        .getElementById(
            "upgradeWheel"
        )
        .style
        .setProperty(

            "--green-angle",

            chance *
            3.6 +
            "deg"

        );

}


/* =====================================================
   NEEDLE
===================================================== */

function randomBetween(
    min,
    max
) {

    return (
        min +
        Math.random() *
        (
            max -
            min
        )
    );

}


async function spinUpgradeNeedle(
    win,
    chance
) {

    const rotor =
        document.getElementById(
            "needleRotor"
        );


    const greenAngle =
        chance *
        3.6;


    let targetAngle;


    if (win) {


        if (
            greenAngle <=
            8
        ) {


            targetAngle =
                greenAngle /
                2;

        }

        else {


            targetAngle =
                randomBetween(
                    4,
                    greenAngle -
                    4
                );

        }

    }

    else {


        targetAngle =
            randomBetween(
                greenAngle +
                5,
                355
            );

    }


    /*
    2–4 полных оборота
    */

    const turns =
        2 +
        Math.floor(
            Math.random() *
            3
        );


    const currentAngle =

        (
            needleRotation %
            360 +
            360
        )

        %

        360;


    const delta =

        (
            targetAngle -
            currentAngle +
            360
        )

        %

        360;


    needleRotation +=

        turns *
        360

        +

        delta;


    rotor.style.transition =
        "transform 4s cubic-bezier(0.12,0.75,0.12,1)";


    rotor.style.transform =
        `rotate(${needleRotation}deg)`;


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                4200
            )
    );

}


/* =========================
   UPGRADE
========================= */

async function upgradeItem() {

    if (upgrading) {
        return;
    }


    const source =
        getSelectedSource();


    const target =
        getSelectedTarget();


    const result =
        document.getElementById(
            "upgradeResult"
        );


    const button =
        document.getElementById(
            "upgradeButton"
        );


    if (!source) {


        result.innerText =
            "❌ Выбери свой Brainrot";


        return;

    }


    if (!target) {


        result.innerText =
            "❌ Выбери Brainrot для апгрейда";


        return;

    }


    upgrading =
        true;


    button.disabled =
        true;


    result.innerText =
        "⚡ Апгрейд...";


    try {


        const data =
            await apiRequest({

                action:
                    "upgrade_item",

                inventory_id:
                    source.id,

                target_brainrot_id:
                    target.brainrot_id

            });


        if (!data.ok) {


            result.innerText =
                "❌ " +
                data.error;


            upgrading =
                false;


            button.disabled =
                false;


            return;

        }


        await spinUpgradeNeedle(
            data.win,
            data.chance
        );


        inventory =
            inventory.filter(
                item =>
                    Number(
                        item.id
                    ) !==
                    Number(
                        source.id
                    )
            );


        if (
            data.win
        ) {


            inventory.unshift(
                data.item
            );


            result.innerText =

                "✅ УСПЕХ!\n" +

                source.brainrot_name +

                " → " +

                data.item.brainrot_name +

                "\nШанс: " +

                data.chance +

                "%";

        }

        else {


            result.innerText =

                "❌ ПРОИГРЫШ\n" +

                source.brainrot_name +

                " сгорел\n" +

                "Шанс: " +

                data.chance +

                "%";

        }


        selectedSourceId =
            null;


        selectedTargetBrainrotId =
            null;


        renderInventory();


        renderUpgradeSourceGrid();


        renderUpgradeTargetGrid();


        updateUpgradeUI();

    }

    catch (error) {


        console.log(
            error
        );


        result.innerText =
            "❌ Ошибка подключения";

    }


    button.disabled =
        false;


    upgrading =
        false;

}


/* =========================
   START
========================= */

loadPlayer();

</script>
